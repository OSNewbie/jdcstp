<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>和风天气</title>
<link rel="stylesheet" href="https://cdn.qweather.com/icons/qweather-icons.css">
<style>
  :root {
    --bg-a: #1a2a4a;
    --bg-b: #2d4a6b;
    --bg-c: #4a6fa5;
    --text-primary: #ffffff;
    --text-secondary: rgba(255,255,255,0.65);
    --glass-bg: rgba(255,255,255,0.10);
    --glass-border: rgba(255,255,255,0.18);
    --glass-blur: 20px;
    --radius-card: 20px;
    --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .theme-clear  { --bg-a:#1e4a7a; --bg-b:#3a7bc8; --bg-c:#6aace0; }
  .theme-cloudy { --bg-a:#2a3a4a; --bg-b:#4a5a6a; --bg-c:#7a8a9a; }
  .theme-rain   { --bg-a:#1a2a3a; --bg-b:#2a4a5a; --bg-c:#4a6a7a; }
  .theme-snow   { --bg-a:#3a4a5a; --bg-b:#5a7a9a; --bg-c:#8aaac0; }
  .theme-night  { --bg-a:#0a1220; --bg-b:#152030; --bg-c:#1e2a40; }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: var(--font-stack);
    color: var(--text-primary);
    min-height: 100vh;
    background: linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 45%, var(--bg-c) 100%);
    transition: background 1.2s ease;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    position: relative;
  }

  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur));
    -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-card);
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .topbar .city {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  .topbar .city small {
    font-weight: 400;
    font-size: 12px;
    color: var(--text-secondary);
    margin-left: 6px;
  }
  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .icon-btn:active { background: rgba(255,255,255,0.22); }

  .search-panel {
    position: absolute;
    top: 64px; left: 16px; right: 16px;
    z-index: 60;
    display: none;
  }
  .search-panel.show { display: block; }
  .search-bar {
    display: flex;
    align-items: center;
    padding: 8px 8px 8px 16px;
    gap: 8px;
  }
  .search-bar input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 15px;
    font-family: var(--font-stack);
  }
  .search-bar input::placeholder { color: rgba(255,255,255,0.4); }
  .search-bar button {
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
    font-family: var(--font-stack);
  }
  .search-results {
    margin-top: 8px;
    max-height: 300px;
    overflow-y: auto;
    display: none;
    border-radius: 16px;
  }
  .search-results.show { display: block; }
  .search-item {
    padding: 14px 18px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .search-item:last-child { border-bottom: none; }
  .search-item:active { background: rgba(255,255,255,0.12); }
  .search-item .s-sub {
    font-size: 11px;
    color: var(--text-secondary);
    margin-left: 8px;
  }

  .warning-banner {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; margin-bottom: 12px;
    border-radius: 14px;
    background: rgba(255, 160, 80, 0.18);
    border: 1px solid rgba(255, 160, 80, 0.35);
    font-size: 13px;
  }
  .warning-banner .w-icon { font-size: 18px; }
  .warning-banner .w-title { flex: 1; font-weight: 600; }
  .warning-banner .w-severity { color: rgba(255,255,255,0.7); font-size: 11px; }

  .hero {
    text-align: center;
    padding: 32px 0 24px;
  }
  .hero .temp {
    font-size: clamp(76px, 22vw, 104px);
    font-weight: 200;
    line-height: 1;
    letter-spacing: -4px;
    font-variant-numeric: tabular-nums;
  }
  .hero .temp sup {
    font-size: 32px;
    font-weight: 300;
    vertical-align: super;
    letter-spacing: 0;
  }
  .hero .condition {
    font-size: 18px;
    font-weight: 500;
    margin-top: 6px;
  }
  .hero .feels-like {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .hero .hi-lo {
    display: inline-flex;
    gap: 14px;
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-secondary);
    padding: 0 4px 8px;
  }

  .hourly-card {
    padding: 16px 0 14px;
    margin-bottom: 18px;
    overflow: hidden;
  }
  .hourly-scroll {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 0 16px;
    scrollbar-width: none;
  }
  .hourly-scroll::-webkit-scrollbar { display: none; }
  .hour-item {
    flex: 0 0 62px;
    text-align: center;
    scroll-snap-align: start;
    position: relative;
    padding-bottom: 8px;
  }
  .hour-item .h-time {
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .hour-item .h-icon {
    font-size: 22px;
    margin-bottom: 6px;
    line-height: 1;
  }
  .hour-item .h-temp {
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .hour-item.now .h-time { color:#fff; font-weight:600; }
  .hour-item.now::after {
    content:'';
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width: 18px; height: 2px; border-radius: 1px;
    background: #fff;
  }
  .h-pop { font-size: 10px; color: #7ec8e3; margin-top: 2px; }
  .h-pop-bar {
    height: 2px; border-radius: 1px;
    background: rgba(255,255,255,0.12);
    margin: 2px 12px 0;
  }
  .h-pop-bar > div {
    height: 100%; border-radius: 1px;
    background: #7ec8e3;
  }

  .daily-card {
    padding: 6px 16px;
    margin-bottom: 18px;
  }
  .day-row {
    display: flex;
    align-items: center;
    padding: 11px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .day-row:last-child { border-bottom: none; }
  .day-name {
    width: 48px;
    font-size: 14px;
    font-weight: 500;
    flex-shrink: 0;
  }
  .day-name.today { color: #fff; font-weight: 700; }
  .day-icon {
    width: 34px;
    text-align: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .day-rain {
    width: 58px;
    font-size: 10px;
    color: var(--text-secondary);
    text-align: right;
    flex-shrink: 0;
    line-height: 1.3;
  }
  .day-bar-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 10px;
    min-width: 0;
  }
  .day-lo, .day-hi {
    font-size: 13px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    width: 28px;
    flex-shrink: 0;
  }
  .day-lo { text-align: right; }
  .day-hi { text-align: left; color:#fff; font-weight:600; }
  .bar-track {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.12);
    position: relative;
    overflow: hidden;
    min-width: 40px;
  }
  .bar-fill {
    position: absolute;
    top: 0; bottom: 0;
    border-radius: 2px;
    background: linear-gradient(90deg, #7ec8e3, #ffd166);
    opacity: 0.85;
  }

  .indices-row {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }
  .index-card {
    flex: 1;
    padding: 14px;
    border-radius: 16px;
  }
  .idx-type { font-size: 11px; color: var(--text-secondary); }
  .idx-category { font-size: 16px; font-weight: 600; margin: 4px 0; }
  .idx-text { font-size: 11px; color: var(--text-secondary); line-height: 1.5; }

  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .metric-card {
    padding: 14px 16px;
    border-radius: 16px;
  }
  .metric-card .m-label {
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .metric-card .m-value {
    font-size: 20px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .metric-card .m-value small {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-secondary);
    margin-left: 3px;
  }
  .metric-card .m-sub {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .aqi-bar {
    height: 3px; border-radius: 2px; margin-top:8px;
    background: linear-gradient(90deg,#6bcf7f,#ffd93d,#ff9f43,#ff6b6b,#a55eea);
    position: relative;
  }
  .aqi-dot {
    position:absolute; top:50%; transform:translate(-50%,-50%);
    width: 8px; height: 8px; border-radius: 50%;
    background:#fff; border:1.5px solid rgba(0,0,0,0.25);
  }

  .loading {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.8;
  }
  .spinner {
    width: 24px; height: 24px;
    border: 2px solid rgba(255,255,255,0.15);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn {
    padding: 10px 18px;
    border-radius: 12px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    font-family: var(--font-stack);
    cursor: pointer;
  }
  .btn-ghost { background: rgba(255,255,255,0.10); color: #fff; border: 1px solid rgba(255,255,255,0.15); }

  @media (max-width: 380px) {
    .metrics-grid { grid-template-columns: 1fr; }
    .indices-row { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="city" id="cityName" onclick="openSearch()">
      定位中… <small>点击搜索城市</small>
    </div>
    <div class="icon-btn" onclick="initLocation()" title="重新定位">◎</div>
  </div>

  <div class="search-panel" id="searchPanel">
    <div class="search-bar glass">
      <input id="searchInput" placeholder="搜索城市，如 北京" autocomplete="off" oninput="onSearchInput()">
      <button onclick="closeSearch()">取消</button>
    </div>
    <div class="search-results glass" id="searchResults"></div>
  </div>

  <div id="mainContent">
    <div class="loading">
      <div class="spinner"></div>
      正在加载…
    </div>
  </div>
</div>

<script>
/* ================================================================
   ★ 替换为你的 Netlify 站点地址（不要带末尾斜杠）
   ================================================================ */
const NETLIFY_SITE = 'https://your-site.netlify.app';
const API_BASE = `${NETLIFY_SITE}/.netlify/functions/weather?path=`;

const state = {
  locationId: null,
  cityName: '',
};

/* ---------------- 通用请求 ---------------- */
async function fetchJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

/* ---------------- 城市搜索 ---------------- */
let searchTimer = null;

function openSearch() {
  document.getElementById('searchPanel').classList.add('show');
  document.getElementById('searchResults').classList.remove('show');
  const input = document.getElementById('searchInput');
  input.value = '';
  setTimeout(() => input.focus(), 100);
}
function closeSearch() {
  document.getElementById('searchPanel').classList.remove('show');
}
function onSearchInput() {
  clearTimeout(searchTimer);
  const q = document.getElementById('searchInput').value.trim();
  const results = document.getElementById('searchResults');
  if (!q) { results.classList.remove('show'); return; }
  searchTimer = setTimeout(() => geolookup(q, false), 300);
}

async function geolookup(name, silent) {
  const results = document.getElementById('searchResults');
  if (!silent) {
    results.innerHTML = '<div class="search-item">搜索中…</div>';
    results.classList.add('show');
  }
  try {
    const data = await fetchJson(
      `${API_BASE}/geo/v2/city/lookup&location=${encodeURIComponent(name)}&number=5&lang=zh`
    );
    if (data.code !== '200' || !data.location || !data.location.length) {
      if (!silent) results.innerHTML = '<div class="search-item">未找到城市</div>';
      return;
    }
    if (silent) {
      selectCity(data.location[0]);
    } else {
      renderSearchResults(data.location);
    }
  } catch (e) {
    if (!silent) results.innerHTML = `<div class="search-item">请求失败：${e.message}</div>`;
  }
}

function renderSearchResults(list) {
  const results = document.getElementById('searchResults');
  results.innerHTML = '';
  list.forEach(loc => {
    const div = document.createElement('div');
    div.className = 'search-item';
    const sub = [loc.adm2, loc.adm1].filter(Boolean).join(' · ');
    div.innerHTML = `${loc.name}<span class="s-sub">${sub}</span>`;
    div.onclick = () => selectCity(loc);
    results.appendChild(div);
  });
  results.classList.add('show');
}

function selectCity(loc) {
  state.locationId = loc.id;
  state.cityName = loc.name;
  closeSearch();
  loadWeather();
}

/* ---------------- 定位 ---------------- */
function initLocation() {
  const main = document.getElementById('mainContent');
  main.innerHTML = '<div class="loading"><div class="spinner"></div>正在定位…</div>';

  if (!navigator.geolocation) {
    geolookup('北京', true);
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async pos => {
      const lon = pos.coords.longitude.toFixed(2);
      const lat = pos.coords.latitude.toFixed(2);
      try {
        const data = await fetchJson(
          `${API_BASE}/geo/v2/city/lookup&location=${lon},${lat}&number=1&lang=zh`
        );
        if (data.code === '200' && data.location?.length) {
          selectCity(data.location[0]);
        } else {
          geolookup('北京', true);
        }
      } catch {
        geolookup('北京', true);
      }
    },
    () => geolookup('北京', true),
    { timeout: 6000, maximumAge: 600000 }
  );
}

/* ---------------- 天气加载 ---------------- */
async function loadWeather() {
  const main = document.getElementById('mainContent');
  main.innerHTML = '<div class="loading"><div class="spinner"></div>加载中…</div>';

  const loc = state.locationId;
  if (!loc) {
    main.innerHTML = '<div class="loading">请先搜索并选择一个城市</div>';
    return;
  }

  const results = await Promise.allSettled([
    fetchJson(`${API_BASE}/v7/weather/now&location=${loc}`),
    fetchJson(`${API_BASE}/v7/weather/24h&location=${loc}`),
    fetchJson(`${API_BASE}/v7/weather/7d&location=${loc}`),
    fetchJson(`${API_BASE}/v7/air/now&location=${loc}`),
    fetchJson(`${API_BASE}/v7/warning/now&location=${loc}`),
    fetchJson(`${API_BASE}/v7/indices/1d&location=${loc}&type=3,5,1`),
  ]);

  const [nowR, hourlyR, dailyR, airR, warnR, idxR] = results;
  const nowData = nowR.status === 'fulfilled' ? nowR.value : null;
  const dailyData = dailyR.status === 'fulfilled' ? dailyR.value : null;

  if (!nowData || nowData.code !== '200' || !dailyData || dailyData.code !== '200') {
    const code = nowData?.code || dailyData?.code || 'NETWORK';
    main.innerHTML = `<div class="loading">加载失败（${code}）<br>
      <button class="btn btn-ghost" style="margin-top:12px" onclick="loadWeather()">重试</button>
    </div>`;
    return;
  }

  const hourly = hourlyR.status === 'fulfilled' && hourlyR.value.code === '200' ? hourlyR.value.hourly : [];
  const air    = airR.status === 'fulfilled' && airR.value.code === '200' ? airR.value.now : null;
  const warning = warnR.status === 'fulfilled' && warnR.value.code === '200' ? warnR.value.warning : [];
  const indices = idxR.status === 'fulfilled' && idxR.value.code === '200' ? idxR.value.daily : [];

  render(nowData.now, hourly, dailyData.daily, air, warning, indices);
}

/* ---------------- 渲染 ---------------- */
function render(now, hourly, daily, air, warning, indices) {
  setTheme(now.icon);

  const today = daily[0] || {};
  document.getElementById('cityName').innerHTML =
    `${state.cityName} <small>${today.fxDate || ''}</small>`;

  const warningHTML = buildWarning(warning);
  const heroHTML = `
    <div class="hero">
      <div class="temp">${now.temp}<sup>°</sup></div>
      <div class="condition">${now.text}</div>
      <div class="feels-like">体感 ${now.feelsLike}°</div>
      <div class="hi-lo">
        <span>最高 ${today.tempMax}°</span>
        <span>最低 ${today.tempMin}°</span>
      </div>
    </div>
  `;
  const hourlyHTML  = buildHourly(hourly);
  const dailyHTML   = buildDaily(daily);
  const indicesHTML = buildIndices(indices);
  const metricsHTML = buildMetrics(now, air);

  document.getElementById('mainContent').innerHTML =
    warningHTML + heroHTML + hourlyHTML +
    '<div class="section-label">7 天预报</div>' + dailyHTML +
    indicesHTML +
    '<div class="section-label" style="margin-top:18px">详细指标</div>' + metricsHTML;
}

function setTheme(iconCode) {
  const body = document.body;
  const c = String(iconCode);
  body.className = '';
  if (c === '150' || c === '151' || c === '153') {
    body.classList.add('theme-night');
  } else if (c.startsWith('1')) {
    body.classList.add('theme-clear');
  } else if (c.startsWith('3')) {
    body.classList.add('theme-rain');
  } else if (c.startsWith('4')) {
    body.classList.add('theme-snow');
  } else {
    body.classList.add('theme-cloudy');
  }
}

function buildWarning(warning) {
  if (!warning || !warning.length) return '';
  const w = warning[0];
  const sev = [w.severity, w.severityColor].filter(Boolean).join(' · ');
  return `
    <div class="warning-banner">
      <span class="w-icon">⚠</span>
      <span class="w-title">${w.title || w.typeName || '气象预警'}</span>
      <span class="w-severity">${sev}</span>
    </div>
  `;
}

function buildHourly(hourly) {
  if (!hourly || !hourly.length) return '';
  const items = hourly.slice(0, 24).map((h, i) => {
    const t = new Date(h.fxTime);
    const label = i === 0 ? '现在' : `${String(t.getHours()).padStart(2, '0')}:00`;
    const pop = parseInt(h.pop, 10) || 0;
    const popHTML = pop > 0 ? `
      <div class="h-pop">${pop}%</div>
      <div class="h-pop-bar"><div style="width:${Math.min(pop, 100)}%"></div></div>
    ` : '';
    return `
      <div class="hour-item ${i === 0 ? 'now' : ''}">
        <div class="h-time">${label}</div>
        <div class="h-icon"><i class="qi-${h.icon}"></i></div>
        <div class="h-temp">${h.temp}°</div>
        ${popHTML}
      </div>
    `;
  }).join('');

  return `
    <div class="section-label">逐小时</div>
    <div class="hourly-card glass">
      <div class="hourly-scroll">${items}</div>
    </div>
  `;
}

function buildDaily(daily) {
  if (!daily || !daily.length) return '';

  const lows  = daily.map(d => parseInt(d.tempMin, 10));
  const highs = daily.map(d => parseInt(d.tempMax, 10));
  const globalMin = Math.min(...lows);
  const globalMax = Math.max(...highs);
  const span = Math.max(globalMax - globalMin, 1);
  const weekNames = ['周日','周一','周二','周三','周四','周五','周六'];

  const rows = daily.map((d, i) => {
    const lo = parseInt(d.tempMin, 10);
    const hi = parseInt(d.tempMax, 10);
    const leftPct  = ((lo - globalMin) / span) * 100;
    const widthPct = Math.max(((hi - lo) / span) * 100, 6);
    const date = new Date(d.fxDate + 'T00:00:00');
    const label = i === 0 ? '今天' : weekNames[date.getDay()];

    const meta = [];
    if (d.precip && d.precip !== '0.0') meta.push(`${d.precip}mm`);
    if (d.uvIndex) meta.push(`UV ${d.uvIndex}`);

    return `
      <div class="day-row">
        <div class="day-name ${i === 0 ? 'today' : ''}">${label}</div>
        <div class="day-icon"><i class="qi-${d.iconDay}"></i></div>
        <div class="day-rain">${meta.join('<br>')}</div>
        <div class="day-bar-wrap">
          <span class="day-lo">${lo}°</span>
          <div class="bar-track">
            <div class="bar-fill" style="left:${leftPct}%; width:${widthPct}%"></div>
          </div>
          <span class="day-hi">${hi}°</span>
        </div>
      </div>
    `;
  }).join('');

  return `<div class="daily-card glass">${rows}</div>`;
}

function buildIndices(indices) {
  if (!indices || !indices.length) return '';
  const cards = indices.map(d => `
    <div class="index-card glass">
      <div class="idx-type">${d.typeName}</div>
      <div class="idx-category">${d.category}</div>
      <div class="idx-text">${d.text || ''}</div>
    </div>
  `).join('');
  return `<div class="section-label">生活指数</div><div class="indices-row">${cards}</div>`;
}

function buildMetrics(now, air) {
  const cards = [];

  cards.push(metricCard('湿度', `${now.humidity}<small>%</small>`, `露点 ${now.dew || '—'}°`));
  cards.push(metricCard('风速', `${now.windSpeed}<small>km/h</small>`, `${now.windDir || ''} ${now.windScale || '—'}级`));
  cards.push(metricCard('气压', `${now.pressure}<small>hPa</small>`, '海平面气压'));
  cards.push(metricCard('能见度', `${now.vis}<small>km</small>`, '水平能见度'));

  if (air) {
    const aqi = parseInt(air.aqi, 10) || 0;
    const pct = Math.min(Math.max(aqi / 300, 0), 1) * 100;
    cards.push(`
      <div class="metric-card glass" style="grid-column: span 2">
        <div class="m-label">空气质量 · ${air.category || '—'}</div>
        <div class="m-value">${air.aqi}<small>AQI</small></div>
        <div class="m-sub">首要污染物：${air.primary || '—'}</div>
        <div class="aqi-bar"><div class="aqi-dot" style="left:${pct}%"></div></div>
      </div>
    `);
  }

  return `<div class="metrics-grid">${cards.join('')}</div>`;
}

function metricCard(label, value, sub) {
  return `
    <div class="metric-card glass">
      <div class="m-label">${label}</div>
      <div class="m-value">${value}</div>
      ${sub ? `<div class="m-sub">${sub}</div>` : ''}
    </div>
  `;
}

/* ---------------- 初始化 ---------------- */
initLocation();
</script>
</body>
</html>
