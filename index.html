<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>节点拓扑分析</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
<div class="container">
  <h1>节点拓扑分析</h1>

  <div class="input-row">
    <input id="subUrl" placeholder="订阅链接（可选）">
    <button id="loadUrl">拉取订阅</button>
  </div>

  <div class="input-row">
    <textarea id="subText" placeholder="或粘贴 Base64 订阅内容 / Clash YAML"></textarea>
  </div>
  <div class="input-row">
    <button id="loadText">解析粘贴内容</button>
    <button id="clearBtn" class="secondary">清空</button>
  </div>

  <div id="status">等待输入...</div>

  <table id="resultTable">
    <thead>
      <tr>
        <th>序号</th><th>节点名</th><th>地区</th><th>AS编号</th>
        <th>组织</th><th>栈</th><th>入口IP</th><th>详细地区</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>拓扑图</h2>
  <div id="topoChart" style="width:100%;height:650px;"></div>
</div>
<script src="app.js"></script>
</body>
</html>
