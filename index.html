<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a2a4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="天气">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.svg">
<title>和风天气</title>
<style>
  :root {
    --bg-a:#1a2a4a; --bg-b:#2d4a6b; --bg-c:#4a6fa5;
    --text-primary:#fff;
    --text-secondary:rgba(255,255,255,0.65);
    --glass-bg:rgba(255,255,255,0.10);
    --glass-border:rgba(255,255,255,0.18);
    --radius-card:20px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --tabbar-h: 58px;
    --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    --emoji-font: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Segoe UI Symbol", sans-serif;
  }
  .theme-clear  { --bg-a:#1e4a7a; --bg-b:#3a7bc8; --bg-c:#6aace0; }
  .theme-cloudy { --bg-a:#2a3a4a; --bg-b:#4a5a6a; --bg-c:#7a8a9a; }
  .theme-rain   { --bg-a:#1a2a3a; --bg-b:#2a4a5a; --bg-c:#4a6a7a; }
  .theme-snow   { --bg-a:#3a4a5a; --bg-b:#5a7a9a; --bg-c:#8aaac0; }
  .theme-night  { --bg-a:#0a1220; --bg-b:#152030; --bg-c:#1e2a40; }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html { overscroll-behavior-y: contain; }
  body { font-family: var(--font-stack); color: var(--text-primary); min-height: 100vh; background: linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 45%, var(--bg-c) 100%); transition: background 1.2s ease; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  .app { max-width: 480px; margin: 0 auto; position: relative; min-height: 100vh; }
  .glass { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: var(--radius-card); }
  .weather-emoji { font-family: var(--emoji-font); display: inline-block; line-height: 1; }

  .topbar { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 40; display: flex; align-items: center; justify-content: space-between; padding: calc(12px + var(--safe-top)) 16px 10px; background: linear-gradient(180deg, var(--bg-a) 0%, var(--bg-a) 70%, transparent 100%); }
  .topbar .city { font-size: 20px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .topbar .city small { font-weight: 400; font-size: 11px; color: var(--text-secondary); }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--glass-bg); border: 1px solid var(--glass-border); color: #fff; font-size: 18px; cursor: pointer; transition: transform 0.15s, background 0.2s; }
  .icon-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.22); }

  main { padding: calc(64px + var(--safe-top)) 16px calc(var(--tabbar-h) + var(--safe-bottom) + 24px); }
  .view { display: none; animation: fadeIn 0.28s ease; }
  .view.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .warning-switch { display: flex; background: rgba(255,255,255,0.08); border-radius: 12px; padding: 3px; margin: 16px 0 14px; border: 1px solid rgba(255,255,255,0.10); }
  .ws-btn { flex: 1; padding: 9px 0; text-align: center; font-size: 13px; font-weight: 500; border-radius: 10px; cursor: pointer; color: var(--text-secondary); transition: background 0.2s, color 0.2s; user-select: none; }
  .ws-btn.active { background: rgba(255,255,255,0.18); color: #fff; font-weight: 600; }

  .warning-banner { display: flex; align-items: center; gap: 10px; padding: 12px 16px; margin-bottom: 12px; border-radius: 14px; background: rgba(255,160,80,0.18); border: 1px solid rgba(255,160,80,0.35); font-size: 13px; cursor: pointer; flex-wrap: wrap; }
  .warning-banner .w-icon { font-size: 18px; }
  .warning-banner .w-title { flex: 1; font-weight: 600; min-width: 0; }
  .warning-banner .w-severity { color: rgba(255,255,255,0.7); font-size: 11px; }
  .warning-detail { display: none; width: 100%; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,160,80,0.25); font-size: 12px; line-height: 1.7; color: rgba(255,255,255,0.85); }
  .warning-detail.show { display: block; }
  .warning-list-item { margin-bottom: 12px; }
  .w-region { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }

  .hero { text-align: center; padding: 24px 0 20px; }
  .hero .main-weather-icon { font-size: 68px; line-height: 1; margin-bottom: 8px; display: inline-block; animation: iconBreathe 4s ease-in-out infinite; }
  @keyframes iconBreathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .hero .temp { font-size: clamp(72px, 22vw, 104px); font-weight: 200; line-height: 1; letter-spacing: -4px; font-variant-numeric: tabular-nums; }
  .hero .temp sup { font-size: 32px; font-weight: 300; vertical-align: super; letter-spacing: 0; }
  .hero .condition { font-size: 18px; font-weight: 500; margin-top: 6px; }
  .hero .feels-like { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
  .hero .hi-lo { display: inline-flex; gap: 14px; margin-top: 10px; font-size: 13px; color: var(--text-secondary); }

  .rain-banner { display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin-bottom: 16px; border-radius: 16px; background: rgba(126,200,227,0.15); border: 1px solid rgba(126,200,227,0.35); cursor: pointer; transition: transform 0.15s; }
  .rain-banner:active { transform: scale(0.98); }
  .rain-banner .rb-icon { font-size: 22px; }
  .rain-banner .rb-text { flex: 1; font-size: 13px; line-height: 1.5; }
  .rain-banner .rb-arrow { color: var(--text-secondary); font-size: 14px; }

  .section-label { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-secondary); padding: 0 4px 8px; }

  .hourly-card { padding: 16px 0 14px; margin-bottom: 18px; overflow: hidden; }
  .hourly-scroll { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 16px; scrollbar-width: none; }
  .hourly-scroll::-webkit-scrollbar { display: none; }
  .hour-item { flex: 0 0 64px; text-align: center; scroll-snap-align: start; position: relative; padding-bottom: 8px; }
  .hour-item .h-time { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; }
  .hour-item .h-icon { font-size: 26px; margin-bottom: 4px; line-height: 1; }
  .hour-item .h-text { font-size: 10px; color: var(--text-secondary); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hour-item .h-temp { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .hour-item.now .h-time { color: #fff; font-weight: 600; }
  .hour-item.now::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 18px; height: 2px; border-radius: 1px; background: #fff; }
  .h-pop { font-size: 9px; color: #7ec8e3; margin-top: 2px; }
  .h-pop-bar { height: 2px; border-radius: 1px; background: rgba(255,255,255,0.12); margin: 2px 12px 0; }
  .h-pop-bar > div { height: 100%; border-radius: 1px; background: #7ec8e3; }

  .daily-card { padding: 6px 16px; margin-bottom: 18px; }
  .day-row { display: flex; align-items: center; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .day-row:last-child { border-bottom: none; }
  .day-name { width: 48px; font-size: 14px; font-weight: 500; flex-shrink: 0; }
  .day-name.today { font-weight: 700; }
  .day-icon { width: 34px; text-align: center; font-size: 22px; flex-shrink: 0; }
  .day-text { width: 46px; font-size: 10px; color: var(--text-secondary); flex-shrink: 0; text-align: center; line-height: 1.3; }
  .day-rain { width: 52px; font-size: 10px; color: var(--text-secondary); text-align: right; flex-shrink: 0; line-height: 1.35; }
  .day-bar-wrap { flex: 1; display: flex; align-items: center; gap: 8px; margin: 0 8px; min-width: 0; }
  .day-lo, .day-hi { font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; width: 28px; flex-shrink: 0; }
  .day-lo { text-align: right; } .day-hi { text-align: left; color: #fff; font-weight: 600; }
  .bar-track { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12); position: relative; overflow: hidden; min-width: 36px; }
  .bar-fill { position: absolute; top: 0; bottom: 0; border-radius: 2px; background: linear-gradient(90deg, #7ec8e3, #ffd166); opacity: 0.85; }

  .rain-summary { padding: 20px 18px; margin-bottom: 16px; font-size: 15px; line-height: 1.6; }
  .rain-summary .rs-title { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; letter-spacing: 0.5px; }
  .rain-chart-card { padding: 20px 16px 14px; margin-bottom: 16px; }
  .rain-chart { display: flex; align-items: flex-end; gap: 2px; height: 120px; padding-bottom: 22px; position: relative; }
  .rain-bar-wrap { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; position: relative; }
  .rain-bar { width: 100%; border-radius: 2px 2px 0 0; background: linear-gradient(180deg, #7ec8e3, #4a9ec9); min-height: 0; transition: height 0.4s ease; }
  .rain-time { position: absolute; bottom: -20px; font-size: 9px; color: var(--text-secondary); white-space: nowrap; }
  .rain-chart-baseline { position: absolute; left: 0; right: 0; bottom: 22px; height: 1px; background: rgba(255,255,255,0.15); }
  .rain-empty { text-align: center; padding: 60px 20px; color: var(--text-secondary); font-size: 14px; line-height: 1.8; }
  .rain-empty .re-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.6; }

  .indices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .index-card { padding: 14px; border-radius: 16px; }
  .idx-type { font-size: 11px; color: var(--text-secondary); }
  .idx-category { font-size: 16px; font-weight: 600; margin: 4px 0; }
  .idx-text { font-size: 10px; color: var(--text-secondary); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .metric-card { padding: 14px 16px; border-radius: 16px; }
  .metric-card .m-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; }
  .metric-card .m-value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .metric-card .m-value small { font-size: 12px; font-weight: 400; color: var(--text-secondary); margin-left: 3px; }
  .metric-card .m-sub { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
  .aqi-bar { height: 3px; border-radius: 2px; margin-top: 8px; background: linear-gradient(90deg, #6bcf7f, #ffd93d, #ff9f43, #ff6b6b, #a55eea); position: relative; }
  .aqi-dot { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 8px; height: 8px; border-radius: 50%; background: #fff; border: 1.5px solid rgba(0,0,0,0.25); }
  .astro-card { display: flex; padding: 16px 0; margin-bottom: 18px; }
  .astro-item { flex: 1; text-align: center; }
  .astro-item .a-label { font-size: 10px; color: var(--text-secondary); margin-bottom: 4px; }
  .astro-item .a-value { font-size: 15px; font-weight: 600; }
  .astro-item .a-sub { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }

  .acc-card { padding: 20px 16px 18px; margin-bottom: 18px; text-align: center; }
  .acc-ring-wrap { display: flex; justify-content: center; margin-bottom: 14px; }
  .acc-ring { --pct: 0; width: 140px; height: 140px; border-radius: 50%; background: conic-gradient(#7ec8e3 0% calc(var(--pct) * 1%), rgba(255,255,255,0.08) calc(var(--pct) * 1%) 100%); display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 0 0 30px rgba(126,200,227,0.2); transition: background 0.6s ease; }
  .acc-ring::before { content: ''; position: absolute; inset: 10px; border-radius: 50%; background: rgba(22,30,44,0.88); backdrop-filter: blur(10px); }
  .acc-inner { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .acc-pct { font-size: 38px; font-weight: 700; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
  .acc-pct sup { font-size: 16px; font-weight: 500; vertical-align: super; opacity: 0.8; }
  .acc-label { font-size: 11px; color: var(--text-secondary); margin-top: 6px; letter-spacing: 1px; }
  .acc-level { font-size: 12px; font-weight: 600; margin-top: 2px; }
  .acc-level.high { color: #7ec8e3; }
  .acc-level.mid  { color: #ffd166; }
  .acc-level.low  { color: #ff9f43; }
  .acc-breakdown { display: flex; gap: 10px; margin: 14px 0 6px; }
  .acc-item { flex: 1; padding: 12px 10px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); }
  .acc-item .ai-label { font-size: 10px; color: var(--text-secondary); margin-bottom: 4px; }
  .acc-item .ai-value { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .acc-item .ai-note { font-size: 9px; color: var(--text-secondary); margin-top: 2px; }
  .acc-sources { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.08); }
  .acc-src-row { display: flex; align-items: center; padding: 8px 0; font-size: 12px; }
  .acc-src-name { flex: 1; text-align: left; color: var(--text-secondary); }
  .acc-src-temp { width: 60px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .acc-src-tag { width: 72px; text-align: right; font-size: 10px; color: var(--text-secondary); }
  .acc-note { margin-top: 12px; font-size: 10px; color: var(--text-secondary); line-height: 1.6; text-align: left; padding: 0 4px; }

  .fx-embed-card { margin-bottom: 18px; border-radius: 20px; overflow: hidden; }
  .fx-embed-frame { display: block; width: 100%; height: 460px; border: none; background: rgba(255,255,255,0.04); }
  .fx-embed-empty { padding: 30px 20px; text-align: center; color: var(--text-secondary); font-size: 12px; line-height: 1.7; }

  .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 50; display: flex; justify-content: space-around; align-items: center; height: calc(var(--tabbar-h) + var(--safe-bottom)); padding-bottom: var(--safe-bottom); background: rgba(20, 28, 42, 0.88); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-top: 1px solid rgba(255,255,255,0.08); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 100%; cursor: pointer; color: var(--text-secondary); font-size: 9px; transition: color 0.2s; user-select: none; }
  .tab .tab-icon { font-size: 18px; line-height: 1; transition: transform 0.2s; }
  .tab:active .tab-icon { transform: scale(0.88); }
  .tab.active { color: #fff; }
  .tab.active .tab-icon { transform: translateY(-1px); }

  .city-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 85; display: none; opacity: 0; transition: opacity 0.25s; }
  .city-backdrop.show { display: block; opacity: 1; }
  .city-sheet { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%); width: 100%; max-width: 480px; z-index: 90; background: rgba(28,36,52,0.97); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-radius: 24px 24px 0 0; border: 1px solid rgba(255,255,255,0.12); border-bottom: none; padding: 10px 16px calc(20px + var(--safe-bottom)); transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1); max-height: 80vh; display: flex; flex-direction: column; }
  .city-sheet.show { transform: translateX(-50%) translateY(0); }
  .cs-handle { width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2); margin: 0 auto 12px; flex-shrink: 0; }
  .cs-title { font-size: 17px; font-weight: 600; margin-bottom: 12px; flex-shrink: 0; }
  .cs-search { display: flex; align-items: center; padding: 8px 8px 8px 16px; gap: 8px; margin-bottom: 10px; flex-shrink: 0; }
  .cs-search input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 14px; font-family: var(--font-stack); }
  .cs-search input::placeholder { color: rgba(255,255,255,0.4); }
  .cs-search button { background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: var(--font-stack); }
  .cs-list { flex: 1; overflow-y: auto; min-height: 100px; }
  .cs-item { display: flex; align-items: center; padding: 14px 4px; border-bottom: 1px solid rgba(255,255,255,0.06); cursor: pointer; }
  .cs-item:last-child { border-bottom: none; }
  .cs-item.active .cs-name { color: #7ec8e3; }
  .cs-info { flex: 1; min-width: 0; }
  .cs-name { font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .cs-sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  .cs-tag { font-size: 10px; color: #7ec8e3; background: rgba(126,200,227,0.15); padding: 1px 6px; border-radius: 4px; font-weight: 400; }
  .cs-del { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.06); border: none; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .cs-del:active { background: rgba(255,80,80,0.25); color: #fff; }
  .cs-add-icon { font-size: 20px; color: var(--text-secondary); flex-shrink: 0; padding-right: 8px; }
  .cs-empty { text-align: center; padding: 40px 20px; color: var(--text-secondary); font-size: 13px; line-height: 1.7; }

  .settings-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
  .settings-overlay.show { display: flex; }
  .settings-panel { width: 100%; max-width: 380px; padding: 24px; border-radius: 24px; background: rgba(28,36,52,0.96); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.12); max-height: 90vh; overflow-y: auto; }
  .settings-panel h3 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  .settings-panel .hint { font-size: 12px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; }
  .settings-panel label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .settings-panel input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.08); color: #fff; font-size: 14px; font-family: var(--font-stack); outline: none; margin-bottom: 14px; }
  .settings-panel input:focus { border-color: rgba(255,255,255,0.45); }
  .settings-panel input::placeholder { color: rgba(255,255,255,0.3); }
  .settings-actions { display: flex; gap: 10px; margin-top: 6px; }
  .btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 14px; font-weight: 600; font-family: var(--font-stack); cursor: pointer; }
  .btn-primary { background: #fff; color: #1a2a4a; }
  .btn-ghost { background: rgba(255,255,255,0.10); color: #fff; border: 1px solid rgba(255,255,255,0.15); }

  .loading { text-align: center; padding: 80px 20px; color: var(--text-secondary); font-size: 14px; line-height: 1.8; }
  .spinner { width: 24px; height: 24px; border: 2px solid rgba(255,255,255,0.15); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 380px) { .metrics-grid, .indices-grid { grid-template-columns: 1fr; } .fx-embed-frame { height: 400px; } }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="city" id="cityName" onclick="openCityPanel()">定位中… <small>▼ 切换</small></div>
    <div class="icon-btn" onclick="openSettings()" title="设置">⚙</div>
  </header>

  <main id="views">
    <section class="view active" id="view-home"><div id="homeContent"><div class="loading"><div class="spinner"></div>正在加载…</div></div></section>
    <section class="view" id="view-rain"><div id="rainContent"></div></section>
    <section class="view" id="view-warning"><div id="warningContent"></div></section>
    <section class="view" id="view-indices"><div id="indicesContent"></div></section>
    <section class="view" id="view-detail"><div id="detailContent"></div></section>
  </main>

  <nav class="tabbar">
    <div class="tab active" data-tab="home" onclick="switchTab('home')"><span class="tab-icon">🏠</span><span>首页</span></div>
    <div class="tab" data-tab="rain" onclick="switchTab('rain')"><span class="tab-icon">🌧</span><span>降雨</span></div>
    <div class="tab" data-tab="warning" onclick="switchTab('warning')"><span class="tab-icon">⚠️</span><span>预警</span></div>
    <div class="tab" data-tab="indices" onclick="switchTab('indices')"><span class="tab-icon">📋</span><span>指数</span></div>
    <div class="tab" data-tab="detail" onclick="switchTab('detail')"><span class="tab-icon">📊</span><span>详情</span></div>
  </nav>
</div>

<div class="city-backdrop" id="cityBackdrop" onclick="closeCityPanel()"></div>
<div class="city-sheet" id="citySheet">
  <div class="cs-handle"></div>
  <div class="cs-title">我的城市</div>
  <div class="cs-search glass">
    <input id="citySearchInput" placeholder="搜索城市添加，如 上海" oninput="onCitySearch()">
    <button onclick="clearCitySearch()">清除</button>
  </div>
  <div class="cs-list" id="cityList"></div>
</div>

<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <h3>和风天气配置</h3>
    <p class="hint">前往 console.qweather.com 创建项目获取 API Key 和 API Host。<br>新用户必须填写专属 Host，老用户可留空。</p>
    <label>API Key</label>
    <input type="text" id="apiKeyInput" placeholder="粘贴你的 API Key" autocomplete="off" spellcheck="false">
    <label>API Host（可选）</label>
    <input type="text" id="apiHostInput" placeholder="默认 devapi.qweather.com" autocomplete="off" spellcheck="false">
    <label>WeatherAPI Key（可选，用于三源共识计算）</label>
    <input type="text" id="weatherApiKeyInput" placeholder="前往 weatherapi.com 注册获取，免费 10 万次/月" autocomplete="off" spellcheck="false">
    <div class="settings-actions">
      <button class="btn btn-ghost" onclick="closeSettings()">取消</button>
      <button class="btn btn-primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
const KEY_API='qweather_api_key', KEY_HOST='qweather_api_host', KEY_WA='weatherapi_key';
const KEY_CITIES='qweather_cities', KEY_ACTIVE='qweather_active_index';
const state = { apiKey:'', apiHost:'', waKey:'', cities:[], activeIndex:0, data:null };
let currentTab = 'home';
let loadSeq = 0;
let warningViewMode = 'local';

/* ===== 天气图标（emoji，不依赖外部字体） ===== */
function weatherEmoji(code) {
  const c = String(code || '');
  const n = parseInt(c, 10);
  if (c === '150' || c === '151' || c === '152' || c === '153') return '🌙';
  if (c === '100') return '☀️';
  if (c === '101' || c === '102' || c === '103') return '⛅';
  if (c === '104') return '☁️';
  if (c === '300' || c === '305') return '🌦️';
  if (c === '302' || c === '303' || c === '304') return '⛈️';
  if (c === '306' || c === '307' || c === '308' || c === '309' || c === '310' || c === '311' || c === '312' || c === '313' || c === '314' || c === '315' || c === '316' || c === '317' || c === '318' || c === '399') return '🌧️';
  if (n >= 400 && n < 500) return '❄️';
  if (c === '503' || c === '504' || c === '507' || c === '508') return '🌪️';
  if (n >= 500 && n < 600) return '🌫️';
  if (n >= 300 && n < 400) return '🌧️';
  if (n >= 100 && n < 200) return '☁️';
  return '🌡️';
}
function iconHtml(code) { return `<span class="weather-emoji">${weatherEmoji(code)}</span>`; }

/* ===== 设置存取 ===== */
function loadSettings() {
  state.apiKey  = localStorage.getItem(KEY_API)  || '';
  state.apiHost = localStorage.getItem(KEY_HOST) || '';
  state.waKey   = localStorage.getItem(KEY_WA)   || '';
  try { const arr = JSON.parse(localStorage.getItem(KEY_CITIES) || '[]'); if (Array.isArray(arr)) state.cities = arr.filter(c => c && c.id); } catch {}
  const idx = parseInt(localStorage.getItem(KEY_ACTIVE) || '0', 10);
  state.activeIndex = Math.min(Math.max(idx, 0), Math.max(state.cities.length - 1, 0));
}
function saveCities() { localStorage.setItem(KEY_CITIES, JSON.stringify(state.cities)); localStorage.setItem(KEY_ACTIVE, String(state.activeIndex)); }
function saveSettings() {
  const key = document.getElementById('apiKeyInput').value.trim();
  const host = document.getElementById('apiHostInput').value.trim();
  const wa = document.getElementById('weatherApiKeyInput').value.trim();
  if (!key) { alert('请填写 API Key'); return; }
  localStorage.setItem(KEY_API, key); localStorage.setItem(KEY_HOST, host); localStorage.setItem(KEY_WA, wa);
  state.apiKey = key; state.apiHost = host; state.waKey = wa; closeSettings();
  state.cities.length ? loadWeather() : initLocation();
}
function openSettings() {
  document.getElementById('apiKeyInput').value = state.apiKey;
  document.getElementById('apiHostInput').value = state.apiHost;
  document.getElementById('weatherApiKeyInput').value = state.waKey;
  document.getElementById('settingsOverlay').classList.add('show');
}
function closeSettings() { document.getElementById('settingsOverlay').classList.remove('show'); }
function getHosts() {
  const h = state.apiHost.trim();
  if (h) { const b = h.startsWith('http') ? h.replace(/\/+$/,'') : `https://${h.replace(/\/+$/,'')}`; return { geo:b, api:b }; }
  return { geo:'https://geoapi.qweather.com', api:'https://devapi.qweather.com' };
}
async function fetchJson(url) { const r = await fetch(url); if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }
function getActiveCity() { return state.cities[state.activeIndex] || null; }

/* ===== 标签切换 ===== */
const TABS = ['home','rain','warning','indices','detail'];
function switchTab(name, updateHash = true) {
  if (!TABS.includes(name)) name = 'home';
  currentTab = name;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  if (updateHash && location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
  window.scrollTo({ top: 0, behavior: 'instant' });
}
window.addEventListener('hashchange', () => { switchTab(location.hash.slice(1) || 'home', false); });

/* ===== 城市管理 ===== */
function openCityPanel() { renderCityList(); document.getElementById('cityBackdrop').classList.add('show'); document.getElementById('citySheet').classList.add('show'); document.getElementById('citySearchInput').value = ''; }
function closeCityPanel() { document.getElementById('cityBackdrop').classList.remove('show'); document.getElementById('citySheet').classList.remove('show'); }
function clearCitySearch() { document.getElementById('citySearchInput').value = ''; renderCityList(); }
function renderCityList() {
  const box = document.getElementById('cityList');
  if (!state.cities.length) { box.innerHTML = '<div class="cs-empty">还没有添加城市<br>在上方搜索框输入城市名添加</div>'; return; }
  box.innerHTML = state.cities.map((c, i) => `<div class="cs-item ${i === state.activeIndex ? 'active' : ''}"><div class="cs-info"><div class="cs-name">${c.name}${i === state.activeIndex ? '<span class="cs-tag">当前</span>' : ''}</div><div class="cs-sub">${c.adm || ''}</div></div><button class="cs-del" title="删除">✕</button></div>`).join('');
  box.querySelectorAll('.cs-item').forEach((el, i) => {
    el.onclick = (e) => { if (e.target.closest('.cs-del')) return; switchCity(i); };
    const del = el.querySelector('.cs-del');
    if (del) del.onclick = (e) => { e.stopPropagation(); removeCity(i); };
  });
}
let citySearchTimer = null;
function onCitySearch() { clearTimeout(citySearchTimer); const q = document.getElementById('citySearchInput').value.trim(); if (!q) { renderCityList(); return; } citySearchTimer = setTimeout(() => searchCityForAdd(q), 300); }
async function searchCityForAdd(q) {
  if (!state.apiKey) { openSettings(); return; }
  const { geo } = getHosts(); const box = document.getElementById('cityList');
  box.innerHTML = '<div class="cs-empty">搜索中…</div>';
  try {
    const data = await fetchJson(`${geo}/geo/v2/city/lookup?location=${encodeURIComponent(q)}&number=8&lang=zh&key=${state.apiKey}`);
    if (data.code !== '200' || !data.location?.length) { box.innerHTML = '<div class="cs-empty">未找到城市</div>'; return; }
    box.innerHTML = data.location.map(loc => {
      const exists = state.cities.some(c => c.id === loc.id);
      const sub = [loc.adm2, loc.adm1].filter(Boolean).join(' · ');
      return `<div class="cs-item"><div class="cs-info"><div class="cs-name">${loc.name}${exists ? '<span class="cs-tag">已添加</span>' : ''}</div><div class="cs-sub">${sub}</div></div><div class="cs-add-icon">${exists ? '✓' : '+'}</div></div>`;
    }).join('');
    box.querySelectorAll('.cs-item').forEach((el, i) => {
      const loc = data.location[i];
      el.onclick = () => addCity({ id: loc.id, name: loc.name, adm: [loc.adm2, loc.adm1].filter(Boolean).join(' · '), lon: parseFloat(loc.lon), lat: parseFloat(loc.lat), adcode: loc.adcode || '' });
    });
  } catch (e) { box.innerHTML = `<div class="cs-empty">请求失败：${e.message}</div>`; }
}
function addCity(city) {
  const idx = state.cities.findIndex(c => c.id === city.id);
  if (idx >= 0) state.activeIndex = idx;
  else { state.cities.push(city); state.activeIndex = state.cities.length - 1; }
  saveCities(); closeCityPanel(); loadWeather();
}
function switchCity(i) { if (i < 0 || i >= state.cities.length) return; if (i === state.activeIndex) { closeCityPanel(); return; } state.activeIndex = i; saveCities(); closeCityPanel(); loadWeather(); }
function removeCity(i) {
  if (state.cities.length <= 1) { alert('至少保留一个城市'); return; }
  state.cities.splice(i, 1);
  if (state.activeIndex > i) state.activeIndex--;
  else if (state.activeIndex === i) state.activeIndex = Math.min(i, state.cities.length - 1);
  saveCities(); renderCityList(); loadWeather();
}

/* ===== 定位 ===== */
function initLocation() {
  if (!state.apiKey) { document.getElementById('homeContent').innerHTML = '<div class="loading">点击右上角 ⚙ 填写和风天气凭据</div>'; openSettings(); return; }
  if (state.cities.length) { loadWeather(); return; }
  document.getElementById('homeContent').innerHTML = '<div class="loading"><div class="spinner"></div>正在定位…</div>';
  if (!navigator.geolocation) { fallbackBeijing(); return; }
  navigator.geolocation.getCurrentPosition(async pos => {
    const lon = pos.coords.longitude.toFixed(2), lat = pos.coords.latitude.toFixed(2);
    const { geo } = getHosts();
    try {
      const data = await fetchJson(`${geo}/geo/v2/city/lookup?location=${lon},${lat}&number=1&lang=zh&key=${state.apiKey}`);
      if (data.code === '200' && data.location?.length) {
        const l = data.location[0];
        addCity({ id:l.id, name:l.name, adm:[l.adm2,l.adm1].filter(Boolean).join(' · '), lon:parseFloat(l.lon), lat:parseFloat(l.lat), adcode:l.adcode||'' });
      } else fallbackBeijing();
    } catch { fallbackBeijing(); }
  }, () => fallbackBeijing(), { timeout: 6000, maximumAge: 600000 });
}
async function fallbackBeijing() {
  const { geo } = getHosts();
  try {
    const data = await fetchJson(`${geo}/geo/v2/city/lookup?location=${encodeURIComponent('北京')}&number=1&lang=zh&key=${state.apiKey}`);
    if (data.code === '200' && data.location?.length) {
      const l = data.location[0];
      addCity({ id:l.id, name:l.name, adm:[l.adm2,l.adm1].filter(Boolean).join(' · '), lon:parseFloat(l.lon), lat:parseFloat(l.lat), adcode:l.adcode||'' });
    } else {
      document.getElementById('homeContent').innerHTML = '<div class="loading">定位失败，请点击顶部手动添加城市</div>';
    }
  } catch (e) { document.getElementById('homeContent').innerHTML = `<div class="loading">加载失败：${e.message}</div>`; }
}

/* ===== 预警（nmc.cn） ===== */
function formatWarningItem(a) {
  const title = a.title || '气象预警';
  const issuetime = a.issuetime || '';
  const detailUrl = a.alertid ? `https://www.nmc.cn/publish/alarm/${a.alertid}.html` : (a.url ? `https://www.nmc.cn${a.url}` : '');
  const regionMatch = title.match(/^(.+?(?:省|市|县|区|旗|盟))气象台/);
  const region = regionMatch ? regionMatch[1] : '';
  return { title, issuetime, detailUrl, region };
}
async function loadLocalWarnings(city) {
  const cityName = city.name.replace(/[市县区旗盟]$/, '').trim();
  if (!cityName) return [];
  try {
    const res = await fetch(`https://www.nmc.cn/rest/findAlarm?pageNo=1&pageSize=50&signaltype=&signallevel=&province=`);
    if (!res.ok) return [];
    const data = await res.json();
    const list = data?.data?.page?.list;
    if (!Array.isArray(list)) return [];
    return list.filter(a => (a.title || '').includes(cityName)).map(formatWarningItem);
  } catch { return []; }
}
async function loadNationwideWarnings() {
  try {
    const res = await fetch(`https://www.nmc.cn/rest/findAlarm?pageNo=1&pageSize=50&signaltype=&signallevel=&province=`);
    if (!res.ok) return [];
    const data = await res.json();
    const list = data?.data?.page?.list;
    if (!Array.isArray(list)) return [];
    return list.map(formatWarningItem);
  } catch { return []; }
}

/* ===== 多源温度采集 ===== */
async function fetchOpenMeteo(city) {
  if (!city.lon || !city.lat) return null;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m&timezone=auto`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    const t = data.current?.temperature_2m;
    return t != null ? parseFloat(t) : null;
  } catch { return null; }
}
async function fetchWeatherAPI(city) {
  if (!state.waKey || !city.lat || !city.lon) return null;
  try {
    const url = `https://api.weatherapi.com/v1/current.json?key=${state.waKey}&q=${city.lat},${city.lon}`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    const t = data.current?.temp_c;
    return t != null ? parseFloat(t) : null;
  } catch { return null; }
}

/* ===== 共识度 ===== */
function calcConsensus(temps) {
  const valid = temps.filter(t => typeof t === 'number' && !isNaN(t));
  if (valid.length < 2) return null;
  const mean = valid.reduce((a, b) => a + b, 0) / valid.length;
  const variance = valid.reduce((s, t) => s + (t - mean) ** 2, 0) / valid.length;
  const spread = Math.sqrt(variance);
  const score = Math.max(0, Math.min(100, Math.round(100 - (spread / 3) * 100)));
  return { score, spread: parseFloat(spread.toFixed(2)), count: valid.length };
}

/* ===== 历史误差（Open-Meteo 提前 1 天 vs ERA5） ===== */
async function fetchHistoricalMAE(city, days = 7) {
  if (!city.lon || !city.lat) return null;
  const end = new Date(); end.setDate(end.getDate() - 2);
  const start = new Date(end); start.setDate(start.getDate() - days + 1);
  const fmt = d => d.toISOString().slice(0, 10);
  try {
    const [prevRes, archRes] = await Promise.all([
      fetch(`https://previous-runs-api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&hourly=temperature_2m_previous_day1&start_date=${fmt(start)}&end_date=${fmt(end)}&models=gfs_seamless`),
      fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${city.lat}&longitude=${city.lon}&hourly=temperature_2m&start_date=${fmt(start)}&end_date=${fmt(end)}`),
    ]);
    if (!prevRes.ok || !archRes.ok) return null;
    const prevData = await prevRes.json();
    const archData = await archRes.json();
    const prev = prevData?.hourly?.temperature_2m_previous_day1 || [];
    const actual = archData?.hourly?.temperature_2m || [];
    if (!prev.length || prev.length !== actual.length) return null;
    let sum = 0, n = 0;
    for (let i = 0; i < prev.length; i++) {
      if (prev[i] != null && actual[i] != null) { sum += Math.abs(prev[i] - actual[i]); n++; }
    }
    if (!n) return null;
    const mae = sum / n;
    const accuracy = Math.max(0, Math.min(100, Math.round(100 - mae * 7)));
    return { mae: parseFloat(mae.toFixed(2)), accuracy, days: Math.round(n / 24) };
  } catch { return null; }
}

/* ===== 天气加载 ===== */
async function loadWeather() {
  const city = getActiveCity();
  if (!city) { document.getElementById('homeContent').innerHTML = '<div class="loading">请先添加城市</div>'; return; }
  const seq = ++loadSeq;
  document.getElementById('homeContent').innerHTML = '<div class="loading"><div class="spinner"></div>加载中…</div>';

  const localWarningsPromise = loadLocalWarnings(city);
  const nationwideWarningsPromise = loadNationwideWarnings();
  const openMeteoPromise = fetchOpenMeteo(city);
  const weatherApiPromise = fetchWeatherAPI(city);
  const maePromise = fetchHistoricalMAE(city, 7);

  const { api } = getHosts(); const key = state.apiKey, loc = city.id;
  const coord = city.lon && city.lat ? `${city.lon},${city.lat}` : null;

  const tasks = [
    fetchJson(`${api}/v7/weather/now?location=${loc}&key=${key}`),
    fetchJson(`${api}/v7/weather/24h?location=${loc}&key=${key}`),
    fetchJson(`${api}/v7/weather/7d?location=${loc}&key=${key}`),
    fetchJson(`${api}/v7/air/now?location=${loc}&key=${key}`),
    fetchJson(`${api}/v7/indices/1d?location=${loc}&type=0&key=${key}`),
  ];
  if (coord) tasks.push(fetchJson(`${api}/v7/minutely/5m?location=${coord}&key=${key}`));
  else tasks.push(Promise.resolve(null));
  tasks.push(fetchJson(`${api}/v7/astronomy/sun?location=${loc}&key=${key}`));
  tasks.push(fetchJson(`${api}/v7/astronomy/moon?location=${loc}&key=${key}`));

  const [r, localWarnings, nationwideWarnings, omTemp, waTemp, mae] = await Promise.all([
    Promise.allSettled(tasks), localWarningsPromise, nationwideWarningsPromise, openMeteoPromise, weatherApiPromise, maePromise
  ]);
  if (seq !== loadSeq) return;

  const nowData = r[0].status==='fulfilled' ? r[0].value : null;
  const dailyData = r[2].status==='fulfilled' ? r[2].value : null;

  if (!nowData || nowData.code !== '200' || !dailyData || dailyData.code !== '200') {
    const code = nowData?.code || dailyData?.code || 'NETWORK';
    let msg = `加载失败（${code}）`;
    if (code === '401' || code === '403') msg = 'API Key 无效或 Host 不正确，请检查设置';
    document.getElementById('homeContent').innerHTML = `<div class="loading">${msg}<br><button class="btn btn-ghost" style="max-width:160px;margin:12px auto 0" onclick="loadWeather()">重试</button></div>`;
    return;
  }

  const qwTemp = parseFloat(nowData.now.temp);
  const temps = [qwTemp, omTemp, waTemp].filter(t => typeof t === 'number' && !isNaN(t));
  const consensus = calcConsensus(temps);

  let overallAcc = null;
  if (consensus && mae) overallAcc = Math.round(consensus.score * 0.4 + mae.accuracy * 0.6);
  else if (consensus) overallAcc = consensus.score;
  else if (mae) overallAcc = mae.accuracy;

  state.data = {
    city, now: nowData.now,
    fxLink: nowData.fxLink || '',
    hourly: r[1].status==='fulfilled' && r[1].value?.code==='200' ? r[1].value.hourly : [],
    daily: dailyData.daily,
    air: r[3].status==='fulfilled' && r[3].value?.code==='200' ? r[3].value.now : null,
    indices: r[4].status==='fulfilled' && r[4].value?.code==='200' ? r[4].value.daily : [],
    localWarnings, nationwideWarnings,
    minutely: r[5].status==='fulfilled' && r[5].value?.code==='200' ? r[5].value : null,
    sun: r[6].status==='fulfilled' && r[6].value?.code==='200' ? r[6].value.daily?.[0] : null,
    moon: r[7].status==='fulfilled' && r[7].value?.code==='200' ? r[7].value.moonPhase?.[0] : null,
    sources: { qweather: qwTemp, openMeteo: omTemp, weatherApi: waTemp },
    consensus, mae, overallAcc,
  };
  renderAll();
}

/* ===== 渲染 ===== */
function renderAll() {
  const d = state.data; if (!d) return;
  setTheme(d.now.icon);
  document.getElementById('cityName').innerHTML = `${d.city.name} <small>▼ 切换</small>`;
  document.getElementById('homeContent').innerHTML = buildHome(d);
  document.getElementById('rainContent').innerHTML = buildRainPage(d.minutely);
  document.getElementById('warningContent').innerHTML = buildWarningPage(d);
  document.getElementById('indicesContent').innerHTML = buildIndicesPage(d.indices);
  document.getElementById('detailContent').innerHTML = buildDetailPage(d);
}

function setTheme(iconCode) {
  const c = String(iconCode); document.body.className = '';
  if (['150','151','153'].includes(c)) document.body.classList.add('theme-night');
  else if (c.startsWith('1')) document.body.classList.add('theme-clear');
  else if (c.startsWith('3')) document.body.classList.add('theme-rain');
  else if (c.startsWith('4')) document.body.classList.add('theme-snow');
  else document.body.classList.add('theme-cloudy');
}

/* ===== 首页 ===== */
function buildHome(d) {
  const today = d.daily[0] || {};
  const hasRain = checkHasRain(d.minutely);
  const localWarns = d.localWarnings || [];
  return `
    ${buildWarningBanner(localWarns)}
    <div class="hero">
      <div class="main-weather-icon">${iconHtml(d.now.icon)}</div>
      <div class="temp">${d.now.temp}<sup>°</sup></div>
      <div class="condition">${d.now.text}</div>
      <div class="feels-like">体感 ${d.now.feelsLike}° · ${today.fxDate || ''}</div>
      <div class="hi-lo"><span>最高 ${today.tempMax}°</span><span>最低 ${today.tempMin}°</span></div>
    </div>
    ${hasRain ? buildRainBanner(d.minutely) : ''}
    ${buildHourly(d.hourly)}
    <div class="section-label">7 天预报</div>
    ${buildDaily(d.daily)}
  `;
}

function buildWarningBanner(alerts) {
  if (!alerts?.length) return '';
  const a = alerts[0];
  return `<div class="warning-banner" onclick="this.querySelector('.warning-detail').classList.toggle('show')">
    <span class="w-icon">⚠</span><span class="w-title">${a.title}</span>
    <span class="w-severity">${a.issuetime}</span>
    <div class="warning-detail">
      ${a.detailUrl ? `<div><a href="${a.detailUrl}" target="_blank" rel="noopener" style="color:#7ec8e3">查看中央气象台详情 ›</a></div>` : ''}
      <div style="margin-top:6px;font-size:11px;opacity:0.6">数据来源：中央气象台（nmc.cn）</div>
    </div>
  </div>`;
}

function checkHasRain(m) {
  if (!m) return false;
  if (m.summary && (m.summary.includes('雨') || m.summary.includes('雪') || m.summary.includes('降水'))) return true;
  if (m.minutely && m.minutely.some(x => parseFloat(x.precip) > 0)) return true;
  return false;
}
function buildRainBanner(m) {
  const summary = m.summary || '未来 2 小时有降水';
  return `<div class="rain-banner" onclick="switchTab('rain')"><span class="rb-icon">🌧</span><span class="rb-text">${summary}</span><span class="rb-arrow">›</span></div>`;
}

function buildHourly(hourly) {
  if (!hourly?.length) return '';
  const items = hourly.slice(0, 24).map((h, i) => {
    const t = new Date(h.fxTime);
    const label = i === 0 ? '现在' : `${String(t.getHours()).padStart(2, '0')}:00`;
    const pop = parseInt(h.pop, 10) || 0;
    return `<div class="hour-item ${i === 0 ? 'now' : ''}">
      <div class="h-time">${label}</div>
      <div class="h-icon">${iconHtml(h.icon)}</div>
      <div class="h-text">${h.text || ''}</div>
      <div class="h-temp">${h.temp}°</div>
      ${pop > 0 ? `<div class="h-pop">降水 ${pop}%</div><div class="h-pop-bar"><div style="width:${Math.min(pop,100)}%"></div></div>` : ''}
    </div>`;
  }).join('');
  return `<div class="section-label">逐小时（未来 24 小时）</div><div class="hourly-card glass"><div class="hourly-scroll">${items}</div></div>`;
}

const UV_CN = v => { const n = parseInt(v, 10); if (isNaN(n)) return ''; return n <= 2 ? '弱' : n <= 4 ? '中等' : n <= 6 ? '强' : n <= 9 ? '很强' : '极强'; };
function buildDaily(daily) {
  if (!daily?.length) return '';
  const lows = daily.map(d => parseInt(d.tempMin, 10)), highs = daily.map(d => parseInt(d.tempMax, 10));
  const gMin = Math.min(...lows), gMax = Math.max(...highs), span = Math.max(gMax - gMin, 1);
  const W = ['周日','周一','周二','周三','周四','周五','周六'];
  const rows = daily.map((d, i) => {
    const lo = parseInt(d.tempMin, 10), hi = parseInt(d.tempMax, 10);
    const left = ((lo - gMin) / span) * 100, width = Math.max(((hi - lo) / span) * 100, 6);
    const dt = new Date(d.fxDate + 'T00:00:00');
    const label = i === 0 ? '今天' : W[dt.getDay()];
    const meta = [];
    if (d.precip && parseFloat(d.precip) > 0) meta.push(`${d.precip}毫米`);
    if (d.uvIndex) meta.push(`UV ${UV_CN(d.uvIndex)}`);
    return `<div class="day-row">
      <div class="day-name ${i === 0 ? 'today' : ''}">${label}</div>
      <div class="day-icon">${iconHtml(d.iconDay)}</div>
      <div class="day-text">${d.textDay || ''}</div>
      <div class="day-rain">${meta.join('<br>')}</div>
      <div class="day-bar-wrap"><span class="day-lo">${lo}°</span>
        <div class="bar-track"><div class="bar-fill" style="left:${left}%;width:${width}%"></div></div>
        <span class="day-hi">${hi}°</span></div>
    </div>`;
  }).join('');
  return `<div class="daily-card glass">${rows}</div>`;
}

/* ===== 降雨页 ===== */
function buildRainPage(m) {
  if (!m || (!m.summary && !m.minutely?.length)) {
    return `<div class="rain-empty"><div class="re-icon">☀️</div>当前无降水<br><span style="font-size:12px;opacity:0.6">未来 2 小时内暂无降水数据</span></div>`;
  }
  const summary = m.summary || '未来 2 小时降水情况';
  const max = Math.max(...m.minutely.map(y => parseFloat(y.precip) || 0), 0.1);
  const bars = m.minutely?.map((x, i) => {
    const v = parseFloat(x.precip) || 0;
    const h = v > 0 ? Math.max((v / max) * 100, 5) : 0;
    const t = new Date(x.fxTime);
    const label = i % 6 === 0 ? `${t.getHours()}:${String(t.getMinutes()).padStart(2, '0')}` : '';
    return `<div class="rain-bar-wrap"><div class="rain-bar" style="height:${h}%"></div>${label ? `<div class="rain-time">${label}</div>` : ''}</div>`;
  }).join('') || '';
  return `<div class="rain-summary glass"><div class="rs-title">未来 2 小时</div>${summary}</div>
    <div class="rain-chart-card glass">
      <div class="section-label" style="padding-left:0">降水趋势（每 5 分钟）</div>
      <div class="rain-chart"><div class="rain-chart-baseline"></div>${bars}</div>
    </div>
    <div style="font-size:11px;color:var(--text-secondary);text-align:center;line-height:1.6;padding:0 20px">柱状高度表示降水量，越高的柱子代表雨势越大。<br>数据每 5 分钟更新一次。</div>`;
}

/* ===== 预警页 ===== */
function buildWarningPage(d) {
  const local = d.localWarnings || [];
  const nationwide = d.nationwideWarnings || [];
  const list = warningViewMode === 'local' ? local : nationwide;
  const cityName = d.city.name;
  const switchHtml = `<div class="warning-switch">
    <div class="ws-btn ${warningViewMode === 'local' ? 'active' : ''}" onclick="switchWarningView('local')">当前地区 · ${cityName}</div>
    <div class="ws-btn ${warningViewMode === 'nationwide' ? 'active' : ''}" onclick="switchWarningView('nationwide')">全国预警 (${nationwide.length})</div>
  </div>`;
  if (!list.length) {
    const emptyMsg = warningViewMode === 'local'
      ? `<div class="rain-empty"><div class="re-icon">✅</div>${cityName} 当前无生效预警<br><span style="font-size:12px;opacity:0.6">可切换到“全国预警”查看其他地区</span></div>`
      : `<div class="rain-empty"><div class="re-icon">✅</div>全国当前无生效预警</div>`;
    return switchHtml + emptyMsg;
  }
  const items = list.map(a => {
    const regionTag = warningViewMode === 'nationwide' && a.region ? `<div class="w-region">📍 ${a.region}</div>` : '';
    return `<div class="warning-list-item">
      <div class="warning-banner" onclick="this.querySelector('.warning-detail').classList.toggle('show')">
        <span class="w-icon">⚠</span>
        <div style="flex:1;min-width:0"><span class="w-title">${a.title}</span>${regionTag}</div>
        <span class="w-severity">${a.issuetime}</span>
        <div class="warning-detail">
          ${a.detailUrl ? `<div><a href="${a.detailUrl}" target="_blank" rel="noopener" style="color:#7ec8e3">查看中央气象台详情 ›</a></div>` : ''}
          <div style="margin-top:6px;font-size:11px;opacity:0.6">数据来源：中央气象台（nmc.cn）</div>
        </div>
      </div>
    </div>`;
  }).join('');
  return switchHtml + `<div class="section-label" style="margin-top:4px">${warningViewMode === 'local' ? `${cityName} 生效预警` : `全国生效预警（前 ${list.length} 条）`}</div>` + items;
}
function switchWarningView(mode) { if (warningViewMode === mode) return; warningViewMode = mode; const d = state.data; if (d) document.getElementById('warningContent').innerHTML = buildWarningPage(d); }

/* ===== 指数页 ===== */
function buildIndicesPage(indices) {
  if (!indices?.length) return `<div class="rain-empty"><div class="re-icon">📋</div>暂无生活指数数据</div>`;
  const cards = indices.map(x => `<div class="index-card glass"><div class="idx-type">${x.name || x.typeName}</div><div class="idx-category">${x.category}</div><div class="idx-text">${x.text || ''}</div></div>`).join('');
  return `<div class="section-label" style="margin-top:16px">生活指数（共 ${indices.length} 项）</div><div class="indices-grid">${cards}</div>`;
}

/* ===== 详情页（含 fxLink 内嵌） ===== */
function buildDetailPage(d) {
  return `
    ${buildAccuracyCard(d)}
    <div class="section-label" style="margin-top:16px">详细指标</div>
    ${buildMetrics(d.now, d.air)}
    ${buildAstro(d.sun, d.moon)}
    ${buildFxEmbed(d)}
  `;
}

function buildFxEmbed(d) {
  const link = d.fxLink;
  if (!link) {
    return `<div class="section-label" style="margin-top:18px">和风天气详情页</div>
      <div class="fx-embed-card glass">
        <div class="fx-embed-empty">当前 API 返回中未包含 fxLink 字段。<br>请确认使用的是和风天气 v7 接口，且 API Host 配置正确。</div>
      </div>`;
  }
  return `<div class="section-label" style="margin-top:18px">和风天气详情页（官方响应式）</div>
    <div class="fx-embed-card glass">
      <iframe class="fx-embed-frame" src="${link}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
    </div>`;
}

/* ===== 准确度卡片 ===== */
function buildAccuracyCard(d) {
  const acc = d.overallAcc;
  if (acc == null) {
    return `<div class="section-label">预报准确度</div>
      <div class="acc-card glass">
        <div class="acc-ring-wrap"><div class="acc-ring" style="--pct:0"><div class="acc-inner"><div class="acc-pct">—</div><div class="acc-label">暂不可算</div></div></div></div>
        <div class="acc-note">需要多家数据源和历史数据才能计算准确度。当前数据源不足或请求失败。</div>
      </div>`;
  }
  const level = acc >= 80 ? { cls: 'high', text: '高度可信' } : acc >= 60 ? { cls: 'mid', text: '较为可信' } : { cls: 'low', text: '存在波动' };
  const c = d.consensus;
  const m = d.mae;
  const src = d.sources || {};
  const srcRows = [
    { name: '和风天气', temp: src.qweather, tag: '主数据源' },
    { name: 'Open-Meteo', temp: src.openMeteo, tag: m ? `历史±${m.mae}°C` : 'ECMWF/GFS' },
    { name: 'WeatherAPI', temp: src.weatherApi, tag: state.waKey ? '免费层' : '未配置' },
  ].filter(r => r.name === '和风天气' || r.temp != null || r.name === 'WeatherAPI');

  return `<div class="section-label">预报准确度</div>
    <div class="acc-card glass">
      <div class="acc-ring-wrap">
        <div class="acc-ring" style="--pct:${acc}">
          <div class="acc-inner">
            <div class="acc-pct">${acc}<sup>%</sup></div>
            <div class="acc-label">综合准确度</div>
            <div class="acc-level ${level.cls}">${level.text}</div>
          </div>
        </div>
      </div>
      <div class="acc-breakdown">
        <div class="acc-item">
          <div class="ai-label">多源共识度</div>
          <div class="ai-value">${c ? c.score + '%' : '—'}</div>
          <div class="ai-note">${c ? c.count + ' 源 · 标准差 ' + c.spread + '°' : '数据不足'}</div>
        </div>
        <div class="acc-item">
          <div class="ai-label">历史准确度</div>
          <div class="ai-value">${m ? m.accuracy + '%' : '—'}</div>
          <div class="ai-note">${m ? '过去 ' + m.days + ' 天 MAE ±' + m.mae + '°C' : '暂无数据'}</div>
        </div>
      </div>
      <div class="acc-sources">
        ${srcRows.map(r => `<div class="acc-src-row">
          <span class="acc-src-name">${r.name}</span>
          <span class="acc-src-temp">${r.temp != null ? r.temp + '°' : '—'}</span>
          <span class="acc-src-tag">${r.tag}</span>
        </div>`).join('')}
      </div>
      <div class="acc-note">
        综合准确度 = 多源共识度 × 40% + 历史准确度 × 60%。共识度基于 ${c ? c.count : 0} 家数据源当前温度的标准差映射；历史准确度基于 Open-Meteo 提前 1 天预报与 ERA5 再分析在过去 ${m ? m.days : 0} 天的逐小时绝对误差。均为真实数据计算，非平台自报值。
      </div>
    </div>`;
}

/* ===== 指标与天文 ===== */
function buildMetrics(now, air) {
  const cards = [];
  cards.push(metricCard('湿度', `${now.humidity}<small>%</small>`, `露点温度 ${now.dew || '—'}°`));
  cards.push(metricCard('风速', `${now.windSpeed}<small>公里/小时</small>`, `${now.windDir || ''} ${now.windScale || '—'}级`));
  cards.push(metricCard('气压', `${now.pressure}<small>百帕</small>`, '海平面气压'));
  cards.push(metricCard('能见度', `${now.vis}<small>公里</small>`, '水平能见度'));
  if (air) {
    const aqi = parseInt(air.aqi, 10) || 0;
    const pct = Math.min(Math.max(aqi / 300, 0), 1) * 100;
    const AIR_CN = aqi <= 50 ? '优' : aqi <= 100 ? '良' : aqi <= 150 ? '轻度污染' : aqi <= 200 ? '中度污染' : aqi <= 300 ? '重度污染' : '严重污染';
    const POLL = { pm2p5:'PM2.5', pm10:'PM10', o3:'臭氧', no2:'二氧化氮', so2:'二氧化硫', co:'一氧化碳' };
    cards.push(`<div class="metric-card glass" style="grid-column:span 2">
      <div class="m-label">空气质量 · ${AIR_CN}</div>
      <div class="m-value">${air.aqi}<small>AQI</small></div>
      <div class="m-sub">首要污染物：${POLL[air.primary] || air.primary || '—'}</div>
      <div class="aqi-bar"><div class="aqi-dot" style="left:${pct}%"></div></div>
    </div>`);
  }
  return `<div class="metrics-grid">${cards.join('')}</div>`;
}

function fmtTime(iso) {
  if (!iso) return '—';
  const m = String(iso).match(/T(\d{2}:\d{2})/);
  return m ? m[1] : String(iso).slice(0, 5);
}
function buildAstro(sun, moon) {
  if (!sun && !moon) return '';
  const items = [];
  if (sun) {
    items.push(`<div class="astro-item"><div class="a-label">日出</div><div class="a-value">${fmtTime(sun.sunrise)}</div></div>`);
    items.push(`<div class="astro-item"><div class="a-label">日落</div><div class="a-value">${fmtTime(sun.sunset)}</div></div>`);
  }
  if (moon) {
    items.push(`<div class="astro-item"><div class="a-label">月相</div><div class="a-value">${moon.name || '—'}</div><div class="a-sub">照明 ${moon.illumination || '—'}%</div></div>`);
    items.push(`<div class="astro-item"><div class="a-label">月升 / 月落</div><div class="a-value">${fmtTime(moon.moonrise)} / ${fmtTime(moon.moonset)}</div></div>`);
  }
  return `<div class="section-label">天文</div><div class="astro-card glass">${items.join('')}</div>`;
}

function metricCard(label, value, sub) {
  return `<div class="metric-card glass"><div class="m-label">${label}</div><div class="m-value">${value}</div>${sub ? `<div class="m-sub">${sub}</div>` : ''}</div>`;
}

/* ===== 手势：横向滑动切换 ===== */
const viewsEl = document.getElementById('views');
let swipeStartX = 0, swipeStartY = 0, swiping = false;
viewsEl.addEventListener('touchstart', e => {
  if (e.target.closest('.hourly-scroll, .indices-grid, .rain-chart, .cs-list, .fx-embed-frame')) return;
  const t = e.touches[0];
  swipeStartX = t.clientX; swipeStartY = t.clientY; swiping = true;
}, { passive: true });
viewsEl.addEventListener('touchend', e => {
  if (!swiping) return; swiping = false;
  const t = e.changedTouches[0];
  const dx = t.clientX - swipeStartX, dy = t.clientY - swipeStartY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    const idx = TABS.indexOf(currentTab);
    if (dx < 0 && idx < TABS.length - 1) switchTab(TABS[idx + 1]);
    if (dx > 0 && idx > 0) switchTab(TABS[idx - 1]);
  }
}, { passive: true });

/* ===== 初始化 ===== */
(function init() {
  loadSettings();
  const hash = location.hash.slice(1);
  if (TABS.includes(hash)) switchTab(hash, false);
  if (!state.apiKey) {
    document.getElementById('homeContent').innerHTML = '<div class="loading">点击右上角 ⚙ 填写和风天气凭据</div>';
    openSettings();
  } else {
    initLocation();
  }
})();
document.getElementById('settingsOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeSettings(); });
</script>
</body>
