<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简论坛测试版</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>极简论坛</h1>
      <span class="badge">测试版</span>
    </div>
  </header>
  
  <main class="container">
    <!-- 发帖区域 -->
    <div class="card create-post">
      <h2>发布新帖</h2>
      <input type="text" id="post-title" placeholder="输入帖子标题...">
      <textarea id="post-content" placeholder="分享你的想法..."></textarea>
      <div class="bottom-row">
        <input type="text" id="post-author" placeholder="你的昵称 (默认匿名)">
        <button id="submit-btn">发布帖子</button>
      </div>
    </div>

    <!-- 帖子列表 -->
    <div id="post-list" class="post-list">
      <!-- 列表会由 JS 渲染在这里 -->
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
