<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>和风天气</title>
<link rel="stylesheet" href="https://cdn.qweather.com/icons/qweather-icons.css">
<style>
  :root {
    --bg-a: #1a2a4a; --bg-b: #2d4a6b; --bg-c: #4a6fa5;
    --text-primary: #ffffff;
    --text-secondary: rgba(255,255,255,0.65);
    --glass-bg: rgba(255,255,255,0.10);
    --glass-border: rgba(255,255,255,0.18);
    --radius-card: 20px;
    --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .theme-clear  { --bg-a:#1e4a7a; --bg-b:#3a7bc8; --bg-c:#6aace0; }
  .theme-cloudy { --bg-a:#2a3a4a; --bg-b:#4a5a6a; --bg-c:#7a8a9a; }
  .theme-rain   { --bg-a:#1a2a3a; --bg-b:#2a4a5a; --bg-c:#4a6a7a; }
  .theme-snow   { --bg-a:#3a4a5a; --bg-b:#5a7a9a; --bg-c:#8aaac0; }
  .theme-night  { --bg-a:#0a1220; --bg-b:#152030; --bg-c:#1e2a40; }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: var(--font-stack); color: var(--text-primary); min-height: 100vh;
    background: linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 45%, var(--bg-c) 100%);
    transition: background 1.2s ease; overflow-x: hidden; -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; position: relative; }
  .glass { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: var(--radius-card); }

  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .topbar .city { font-size:20px; font-weight:600; cursor:pointer; }
  .topbar .city small { font-weight:400; font-size:12px; color:var(--text-secondary); margin-left:6px; }
  .icon-btn { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--glass-bg); border:1px solid var(--glass-border); color:#fff; font-size:18px; cursor:pointer; }

  .search-panel { position:absolute; top:64px; left:16px; right:16px; z-index:60; display:none; }
  .search-panel.show { display:block; }
  .search-bar { display:flex; align-items:center; padding:8px 8px 8px 16px; gap:8px; }
  .search-bar input { flex:1; background:transparent; border:none; outline:none; color:#fff; font-size:15px; font-family:var(--font-stack); }
  .search-bar input::placeholder { color:rgba(255,255,255,0.4); }
  .search-bar button { background:rgba(255,255,255,0.15); border:none; color:#fff; padding:8px 14px; border-radius:10px; font-size:13px; cursor:pointer; font-family:var(--font-stack); }
  .search-results { margin-top:8px; max-height:300px; overflow-y:auto; display:none; border-radius:16px; }
  .search-results.show { display:block; }
  .search-item { padding:14px 18px; font-size:14px; cursor:pointer; border-bottom:1px solid rgba(255,255,255,0.06); }
  .search-item:last-child { border-bottom:none; }
  .search-item .s-sub { font-size:11px; color:var(--text-secondary); margin-left:8px; }

  .warning-banner { display:flex; align-items:center; gap:10px; padding:12px 16px; margin-bottom:12px; border-radius:14px; background:rgba(255,160,80,0.18); border:1px solid rgba(255,160,80,0.35); font-size:13px; cursor:pointer; }
  .warning-banner .w-icon { font-size:18px; }
  .warning-banner .w-title { flex:1; font-weight:600; }
  .warning-banner .w-severity { color:rgba(255,255,255,0.7); font-size:11px; }
  .warning-detail { display:none; margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,160,80,0.25); font-size:12px; line-height:1.7; color:rgba(255,255,255,0.8); }
  .warning-detail.show { display:block; }

  .minutely-tip { font-size:13px; color:#7ec8e3; text-align:center; padding:6px 0 2px; }

  .hero { text-align:center; padding:28px 0 20px; }
  .hero .temp { font-size:clamp(76px,22vw,104px); font-weight:200; line-height:1; letter-spacing:-4px; font-variant-numeric:tabular-nums; }
  .hero .temp sup { font-size:32px; font-weight:300; vertical-align:super; letter-spacing:0; }
  .hero .condition { font-size:18px; font-weight:500; margin-top:6px; }
  .hero .feels-like { font-size:13px; color:var(--text-secondary); margin-top:4px; }
  .hero .hi-lo { display:inline-flex; gap:14px; margin-top:10px; font-size:13px; color:var(--text-secondary); }

  .section-label { font-size:11px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-secondary); padding:0 4px 8px; }

  .hourly-card { padding:16px 0 14px; margin-bottom:18px; overflow:hidden; }
  .hourly-scroll { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; padding:0 16px; scrollbar-width:none; }
  .hourly-scroll::-webkit-scrollbar { display:none; }
  .hour-item { flex:0 0 62px; text-align:center; scroll-snap-align:start; position:relative; padding-bottom:8px; }
  .hour-item .h-time { font-size:11px; color:var(--text-secondary); margin-bottom:6px; }
  .hour-item .h-icon { font-size:22px; margin-bottom:6px; line-height:1; }
  .hour-item .h-temp { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
  .hour-item.now .h-time { color:#fff; font-weight:600; }
  .hour-item.now::after { content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:18px; height:2px; border-radius:1px; background:#fff; }
  .h-pop { font-size:10px; color:#7ec8e3; margin-top:2px; }
  .h-pop-bar { height:2px; border-radius:1px; background:rgba(255,255,255,0.12); margin:2px 12px 0; }
  .h-pop-bar > div { height:100%; border-radius:1px; background:#7ec8e3; }

  .daily-card { padding:6px 16px; margin-bottom:18px; }
  .day-row { display:flex; align-items:center; padding:11px 0; border-bottom:1px solid rgba(255,255,255,0.06); }
  .day-row:last-child { border-bottom:none; }
  .day-name { width:48px; font-size:14px; font-weight:500; flex-shrink:0; }
  .day-name.today { font-weight:700; }
  .day-icon { width:34px; text-align:center; font-size:20px; flex-shrink:0; }
  .day-rain { width:62px; font-size:10px; color:var(--text-secondary); text-align:right; flex-shrink:0; line-height:1.35; }
  .day-bar-wrap { flex:1; display:flex; align-items:center; gap:8px; margin:0 10px; min-width:0; }
  .day-lo, .day-hi { font-size:13px; color:var(--text-secondary); font-variant-numeric:tabular-nums; width:28px; flex-shrink:0; }
  .day-lo { text-align:right; } .day-hi { text-align:left; color:#fff; font-weight:600; }
  .bar-track { flex:1; height:4px; border-radius:2px; background:rgba(255,255,255,0.12); position:relative; overflow:hidden; min-width:40px; }
  .bar-fill { position:absolute; top:0; bottom:0; border-radius:2px; background:linear-gradient(90deg,#7ec8e3,#ffd166); opacity:0.85; }

  .indices-row { display:flex; gap:10px; margin-bottom:18px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .indices-row::-webkit-scrollbar { display:none; }
  .index-card { flex:0 0 128px; padding:14px; border-radius:16px; }
  .idx-type { font-size:11px; color:var(--text-secondary); }
  .idx-category { font-size:15px; font-weight:600; margin:4px 0; }
  .idx-text { font-size:10px; color:var(--text-secondary); line-height:1.5; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

  .astro-card { display:flex; gap:0; padding:16px 0; margin-bottom:18px; }
  .astro-item { flex:1; text-align:center; }
  .astro-item .a-label { font-size:10px; color:var(--text-secondary); margin-bottom:4px; }
  .astro-item .a-value { font-size:16px; font-weight:600; }
  .astro-item .a-sub { font-size:10px; color:var(--text-secondary); margin-top:2px; }

  .metrics-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .metric-card { padding:14px 16px; border-radius:16px; }
  .metric-card .m-label { font-size:11px; color:var(--text-secondary); margin-bottom:6px; }
  .metric-card .m-value { font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; }
  .metric-card .m-value small { font-size:12px; font-weight:400; color:var(--text-secondary); margin-left:3px; }
  .metric-card .m-sub { font-size:11px; color:var(--text-secondary); margin-top:4px; }
  .aqi-bar { height:3px; border-radius:2px; margin-top:8px; background:linear-gradient(90deg,#6bcf7f,#ffd93d,#ff9f43,#ff6b6b,#a55eea); position:relative; }
  .aqi-dot { position:absolute; top:50%; transform:translate(-50%,-50%); width:8px; height:8px; border-radius:50%; background:#fff; border:1.5px solid rgba(0,0,0,0.25); }

  .settings-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:100; padding:24px; }
  .settings-overlay.show { display:flex; }
  .settings-panel { width:100%; max-width:380px; padding:24px; border-radius:24px; background:rgba(28,36,52,0.94); backdrop-filter:blur(30px); border:1px solid rgba(255,255,255,0.12); }
  .settings-panel h3 { font-size:17px; font-weight:600; margin-bottom:6px; }
  .settings-panel .hint { font-size:12px; color:var(--text-secondary); line-height:1.6; margin-bottom:16px; }
  .settings-panel label { display:block; font-size:12px; color:var(--text-secondary); margin-bottom:6px; }
  .settings-panel input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.08); color:#fff; font-size:14px; font-family:var(--font-stack); outline:none; margin-bottom:14px; }
  .settings-panel input:focus { border-color:rgba(255,255,255,0.45); }
  .settings-panel input::placeholder { color:rgba(255,255,255,0.3); }
  .settings-actions { display:flex; gap:10px; margin-top:6px; }
  .btn { flex:1; padding:12px; border-radius:12px; border:none; font-size:14px; font-weight:600; font-family:var(--font-stack); cursor:pointer; }
  .btn-primary { background:#fff; color:#1a2a4a; }
  .btn-ghost { background:rgba(255,255,255,0.10); color:#fff; border:1px solid rgba(255,255,255,0.15); }

  .loading { text-align:center; padding:80px 20px; color:var(--text-secondary); font-size:14px; line-height:1.8; }
  .spinner { width:24px; height:24px; border:2px solid rgba(255,255,255,0.15); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; margin:0 auto 14px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  @media (max-width:380px) { .metrics-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="city" id="cityName" onclick="openSearch()">定位中… <small>点击搜索城市</small></div>
    <div class="icon-btn" onclick="openSettings()" title="设置">⚙</div>
  </div>

  <div class="search-panel" id="searchPanel">
    <div class="search-bar glass">
      <input id="searchInput" placeholder="搜索城市，如 北京" autocomplete="off" oninput="onSearchInput()">
      <button onclick="closeSearch()">取消</button>
    </div>
    <div class="search-results glass" id="searchResults"></div>
  </div>

  <div id="mainContent"><div class="loading"><div class="spinner"></div>正在加载…</div></div>
</div>

<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <h3>和风天气配置</h3>
    <p class="hint">前往 console.qweather.com 创建项目获取 API Key 和 API Host。<br>新用户必须填写专属 Host，老用户可留空。</p>
    <label>API Key</label>
    <input type="text" id="apiKeyInput" placeholder="粘贴你的 API Key" autocomplete="off" spellcheck="false">
    <label>API Host（可选）</label>
    <input type="text" id="apiHostInput" placeholder="默认 devapi.qweather.com" autocomplete="off" spellcheck="false">
    <div class="settings-actions">
      <button class="btn btn-ghost" onclick="closeSettings()">取消</button>
      <button class="btn btn-primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
/* ================================================================
   状态与配置
   ================================================================ */
const KEY_API='qweather_api_key', KEY_HOST='qweather_api_host', KEY_CITY='qweather_last_city';
const state = { apiKey:'', apiHost:'', locationId:null, cityName:'', lon:null, lat:null };

function loadSettings() {
  state.apiKey  = localStorage.getItem(KEY_API)  || '';
  state.apiHost = localStorage.getItem(KEY_HOST) || '';
  const c = localStorage.getItem(KEY_CITY);
  if (c) { try { const o=JSON.parse(c); state.locationId=o.id; state.cityName=o.name; state.lon=o.lon; state.lat=o.lat; } catch {} }
}
function saveSettings() {
  const key = document.getElementById('apiKeyInput').value.trim();
  const host = document.getElementById('apiHostInput').value.trim();
  if (!key) { alert('请填写 API Key'); return; }
  localStorage.setItem(KEY_API, key); localStorage.setItem(KEY_HOST, host);
  state.apiKey = key; state.apiHost = host; closeSettings();
  state.locationId ? loadWeather() : initLocation();
}
function openSettings() {
  document.getElementById('apiKeyInput').value = state.apiKey;
  document.getElementById('apiHostInput').value = state.apiHost;
  document.getElementById('settingsOverlay').classList.add('show');
}
function closeSettings() { document.getElementById('settingsOverlay').classList.remove('show'); }

function getHosts() {
  const h = state.apiHost.trim();
  if (h) { const b = h.startsWith('http') ? h.replace(/\/+$/,'') : `https://${h.replace(/\/+$/,'')}`; return { geo:b, api:b }; }
  return { geo:'https://geoapi.qweather.com', api:'https://devapi.qweather.com' };
}
async function fetchJson(url) { const r = await fetch(url); if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }

/* ================================================================
   城市搜索
   ================================================================ */
let searchTimer = null;
function openSearch() { document.getElementById('searchPanel').classList.add('show'); document.getElementById('searchResults').classList.remove('show'); setTimeout(()=>document.getElementById('searchInput').focus(),100); }
function closeSearch() { document.getElementById('searchPanel').classList.remove('show'); }
function onSearchInput() {
  clearTimeout(searchTimer);
  const q = document.getElementById('searchInput').value.trim();
  const box = document.getElementById('searchResults');
  if (!q) { box.classList.remove('show'); return; }
  searchTimer = setTimeout(() => geolookup(q, false), 300);
}

async function geolookup(name, silent) {
  if (!state.apiKey) { openSettings(); return; }
  const { geo } = getHosts();
  const box = document.getElementById('searchResults');
  if (!silent) { box.innerHTML='<div class="search-item">搜索中…</div>'; box.classList.add('show'); }
  try {
    const data = await fetchJson(`${geo}/geo/v2/city/lookup?location=${encodeURIComponent(name)}&number=5&lang=zh&key=${state.apiKey}`);
    if (data.code!=='200'||!data.location?.length) { if(!silent) box.innerHTML='<div class="search-item">未找到城市</div>'; return; }
    if (silent) selectCity(data.location[0]); else renderSearchResults(data.location);
  } catch(e) { if(!silent) box.innerHTML=`<div class="search-item">请求失败：${e.message}</div>`; }
}
function renderSearchResults(list) {
  const box = document.getElementById('searchResults'); box.innerHTML='';
  list.forEach(loc => {
    const d = document.createElement('div'); d.className='search-item';
    d.innerHTML = `${loc.name}<span class="s-sub">${[loc.adm2,loc.adm1].filter(Boolean).join(' · ')}</span>`;
    d.onclick = () => selectCity(loc); box.appendChild(d);
  });
  box.classList.add('show');
}
function selectCity(loc) {
  state.locationId = loc.id; state.cityName = loc.name;
  state.lon = parseFloat(loc.lon); state.lat = parseFloat(loc.lat);
  localStorage.setItem(KEY_CITY, JSON.stringify({ id:loc.id, name:loc.name, lon:loc.lon, lat:loc.lat }));
  closeSearch(); loadWeather();
}

/* ================================================================
   定位
   ================================================================ */
function initLocation() {
  if (!state.apiKey) { document.getElementById('mainContent').innerHTML='<div class="loading">点击右上角 ⚙ 填写和风天气凭据</div>'; return; }
  if (state.locationId) { loadWeather(); return; }
  document.getElementById('mainContent').innerHTML='<div class="loading"><div class="spinner"></div>正在定位…</div>';
  if (!navigator.geolocation) { geolookup('北京', true); return; }
  navigator.geolocation.getCurrentPosition(
    async pos => {
      const lon = pos.coords.longitude.toFixed(2), lat = pos.coords.latitude.toFixed(2);
      const { geo } = getHosts();
      try {
        const data = await fetchJson(`${geo}/geo/v2/city/lookup?location=${lon},${lat}&number=1&lang=zh&key=${state.apiKey}`);
        data.code==='200' && data.location?.length ? selectCity(data.location[0]) : geolookup('北京', true);
      } catch { geolookup('北京', true); }
    },
    () => geolookup('北京', true),
    { timeout:6000, maximumAge:600000 }
  );
}

/* ================================================================
   天气加载
   ================================================================ */
async function loadWeather() {
  const main = document.getElementById('mainContent');
  main.innerHTML='<div class="loading"><div class="spinner"></div>加载中…</div>';
  if (!state.locationId) { main.innerHTML='<div class="loading">请先搜索城市</div>'; return; }

  const { api } = getHosts();
  const key = state.apiKey, loc = state.locationId;
  const coord = state.lon && state.lat ? `${state.lon},${state.lat}` : null;

  const tasks = [
    fetchJson(`${api}/v7/weather/now?location=${loc}&key=${key}`),
    fetchJson(`${api}/v7/weather/24h?location=${loc}&key=${key}`),
    fetchJson(`${api}/v7/weather/7d?location=${loc}&key=${key}`),
    fetchJson(`${api}/v7/air/now?location=${loc}&key=${key}`),
    fetchJson(`${api}/v7/indices/1d?location=${loc}&type=0&key=${key}`),
  ];
  // 预警 v1 需要经纬度；分钟级降水也需要经纬度；天文需要 LocationID
  if (coord) {
    tasks.push(fetchJson(`${api}/weatheralert/v1/current/${state.lat}/${state.lon}?key=${key}`));
    tasks.push(fetchJson(`${api}/v7/minutely/5m?location=${coord}&key=${key}`));
  } else {
    tasks.push(Promise.resolve(null)); tasks.push(Promise.resolve(null));
  }
  tasks.push(fetchJson(`${api}/v7/astronomy/sun?location=${loc}&key=${key}`));
  tasks.push(fetchJson(`${api}/v7/astronomy/moon?location=${loc}&key=${key}`));

  const r = await Promise.allSettled(tasks);
  const nowData   = r[0].status==='fulfilled' ? r[0].value : null;
  const hourlyData= r[1].status==='fulfilled' ? r[1].value : null;
  const dailyData = r[2].status==='fulfilled' ? r[2].value : null;
  const airData   = r[3].status==='fulfilled' ? r[3].value : null;
  const idxData   = r[4].status==='fulfilled' ? r[4].value : null;
  const warnData  = r[5].status==='fulfilled' ? r[5].value : null;
  const minData   = r[6].status==='fulfilled' ? r[6].value : null;
  const sunData   = r[7].status==='fulfilled' ? r[7].value : null;
  const moonData  = r[8].status==='fulfilled' ? r[8].value : null;

  if (!nowData || nowData.code!=='200' || !dailyData || dailyData.code!=='200') {
    const code = nowData?.code || dailyData?.code || 'NETWORK';
    let msg = `加载失败（${code}）`;
    if (code==='401'||code==='403') msg = 'API Key 无效或 Host 不正确，请检查设置';
    main.innerHTML = `<div class="loading">${msg}<br><button class="btn btn-ghost" style="max-width:160px;margin:12px auto 0" onclick="loadWeather()">重试</button></div>`;
    return;
  }

  render({
    now: nowData.now,
    hourly: hourlyData?.code==='200' ? hourlyData.hourly : [],
    daily: dailyData.daily,
    air: airData?.code==='200' ? airData.now : null,
    indices: idxData?.code==='200' ? idxData.daily : [],
    warnings: warnData?.alerts || warnData?.warning || [],
    minutely: minData?.code==='200' ? minData : null,
    sun: sunData?.code==='200' ? sunData.daily?.[0] : null,
    moon: moonData?.code==='200' ? moonData.moonPhase?.[0] : null,
  });
}

/* ================================================================
   渲染
   ================================================================ */
function render(d) {
  setTheme(d.now.icon);
  document.getElementById('cityName').innerHTML = `${state.cityName} <small>${d.daily[0]?.fxDate || ''}</small>`;

  document.getElementById('mainContent').innerHTML =
    buildWarning(d.warnings) +
    buildHero(d.now, d.daily[0]) +
    buildMinutelyTip(d.minutely) +
    buildHourly(d.hourly) +
    '<div class="section-label">7 天预报</div>' + buildDaily(d.daily) +
    buildIndices(d.indices) +
    buildAstro(d.sun, d.moon) +
    '<div class="section-label" style="margin-top:18px">详细指标</div>' + buildMetrics(d.now, d.air);
}

function setTheme(iconCode) {
  const c = String(iconCode); document.body.className='';
  if (['150','151','153'].includes(c)) document.body.classList.add('theme-night');
  else if (c.startsWith('1')) document.body.classList.add('theme-clear');
  else if (c.startsWith('3')) document.body.classList.add('theme-rain');
  else if (c.startsWith('4')) document.body.classList.add('theme-snow');
  else document.body.classList.add('theme-cloudy');
}

/* ---------- 预警 ---------- */
const SEVERITY_CN = { minor:'一般', moderate:'较重', severe:'严重', extreme:'特别严重' };
function buildWarning(alerts) {
  if (!alerts?.length) return '';
  const a = alerts[0];
  const title = a.headline || a.title || '气象预警';
  const sev = SEVERITY_CN[a.severity] || a.severity || '';
  const color = a.color?.code || '';
  const desc = a.description || a.text || '';
  const instr = a.instruction || '';
  const expire = a.expireTime || a.endTime || '';
  return `
    <div class="warning-banner" onclick="this.querySelector('.warning-detail')?.classList.toggle('show')">
      <span class="w-icon">⚠</span>
      <span class="w-title">${title}</span>
      <span class="w-severity">${sev}${color ? ' · '+color : ''}</span>
      <div class="warning-detail">
        ${desc ? '<div>'+desc+'</div>' : ''}
        ${instr ? '<div style="margin-top:6px;color:#ffd166">防御指南：'+instr+'</div>' : ''}
        ${expire ? '<div style="margin-top:6px;font-size:11px;opacity:0.6">有效期至 '+expire+'</div>' : ''}
      </div>
    </div>`;
}

/* ---------- Hero ---------- */
function buildHero(now, today) {
  return `<div class="hero">
    <div class="temp">${now.temp}<sup>°</sup></div>
    <div class="condition">${now.text}</div>
    <div class="feels-like">体感 ${now.feelsLike}°</div>
    <div class="hi-lo"><span>最高 ${today?.tempMax}°</span><span>最低 ${today?.tempMin}°</span></div>
  </div>`;
}

/* ---------- 分钟级降水 ---------- */
function buildMinutelyTip(m) {
  if (!m?.summary) return '';
  return `<div class="minutely-tip">🌧 ${m.summary}</div>`;
}

/* ---------- 逐小时 ---------- */
function buildHourly(hourly) {
  if (!hourly?.length) return '';
  const items = hourly.slice(0,24).map((h,i) => {
    const t = new Date(h.fxTime);
    const label = i===0 ? '现在' : `${String(t.getHours()).padStart(2,'0')}:00`;
    const pop = parseInt(h.pop,10) || 0;
    return `<div class="hour-item ${i===0?'now':''}">
      <div class="h-time">${label}</div>
      <div class="h-icon"><i class="qi-${h.icon}"></i></div>
      <div class="h-temp">${h.temp}°</div>
      ${pop>0 ? `<div class="h-pop">降水 ${pop}%</div><div class="h-pop-bar"><div style="width:${Math.min(pop,100)}%"></div></div>` : ''}
    </div>`;
  }).join('');
  return `<div class="section-label">逐小时（未来 24 小时）</div><div class="hourly-card glass"><div class="hourly-scroll">${items}</div></div>`;
}

/* ---------- 7 天 ---------- */
const UV_CN = v => { const n=parseInt(v,10); if(isNaN(n)) return ''; return n<=2?'弱':n<=4?'中等':n<=6?'强':n<=9?'很强':'极强'; };
const PRECIP_CN = v => { const n=parseFloat(v); if(isNaN(n)||n===0) return ''; return n<10?`${n}毫米`:`${n}毫米`; };

function buildDaily(daily) {
  if (!daily?.length) return '';
  const lows = daily.map(d=>parseInt(d.tempMin,10)), highs = daily.map(d=>parseInt(d.tempMax,10));
  const gMin=Math.min(...lows), gMax=Math.max(...highs), span=Math.max(gMax-gMin,1);
  const W=['周日','周一','周二','周三','周四','周五','周六'];
  const rows = daily.map((d,i)=>{
    const lo=parseInt(d.tempMin,10), hi=parseInt(d.tempMax,10);
    const left=((lo-gMin)/span)*100, width=Math.max(((hi-lo)/span)*100,6);
    const dt = new Date(d.fxDate+'T00:00:00');
    const label = i===0?'今天':W[dt.getDay()];
    const meta=[];
    if (d.precip && parseFloat(d.precip)>0) meta.push(`降水 ${PRECIP_CN(d.precip)}`);
    if (d.uvIndex) meta.push(`紫外线 ${UV_CN(d.uvIndex)}`);
    return `<div class="day-row">
      <div class="day-name ${i===0?'today':''}">${label}</div>
      <div class="day-icon"><i class="qi-${d.iconDay}"></i></div>
      <div class="day-rain">${meta.join('<br>')}</div>
      <div class="day-bar-wrap"><span class="day-lo">${lo}°</span>
        <div class="bar-track"><div class="bar-fill" style="left:${left}%;width:${width}%"></div></div>
        <span class="day-hi">${hi}°</span></div>
    </div>`;
  }).join('');
  return `<div class="daily-card glass">${rows}</div>`;
}

/* ---------- 生活指数（全部 16 类） ---------- */
function buildIndices(indices) {
  if (!indices?.length) return '';
  const cards = indices.map(d=>`
    <div class="index-card glass">
      <div class="idx-type">${d.name || d.typeName}</div>
      <div class="idx-category">${d.category}</div>
      <div class="idx-text">${d.text || ''}</div>
    </div>`).join('');
  return `<div class="section-label">生活指数</div><div class="indices-row">${cards}</div>`;
}

/* ---------- 天文 ---------- */
function fmtTime(iso) {
  if (!iso) return '—';
  const m = String(iso).match(/T(\d{2}:\d{2})/);
  return m ? m[1] : String(iso).slice(0,5);
}
function buildAstro(sun, moon) {
  if (!sun && !moon) return '';
  const items = [];
  if (sun) {
    items.push(`<div class="astro-item"><div class="a-label">日出</div><div class="a-value">${fmtTime(sun.sunrise)}</div></div>`);
    items.push(`<div class="astro-item"><div class="a-label">日落</div><div class="a-value">${fmtTime(sun.sunset)}</div></div>`);
  }
  if (moon) {
    items.push(`<div class="astro-item"><div class="a-label">月相</div><div class="a-value">${moon.name || '—'}</div><div class="a-sub">照明 ${moon.illumination || '—'}%</div></div>`);
    items.push(`<div class="astro-item"><div class="a-label">月升 / 月落</div><div class="a-value">${fmtTime(moon.moonrise)} / ${fmtTime(moon.moonset)}</div></div>`);
  }
  return `<div class="section-label">天文</div><div class="astro-card glass">${items.join('')}</div>`;
}

/* ---------- 详细指标 ---------- */
const AIR_CN = a => {
  const n = parseInt(a,10);
  if (isNaN(n)) return '—';
  if (n<=50) return '优'; if (n<=100) return '良'; if (n<=150) return '轻度污染';
  if (n<=200) return '中度污染'; if (n<=300) return '重度污染'; return '严重污染';
};

function buildMetrics(now, air) {
  const cards = [];
  cards.push(metricCard('湿度', `${now.humidity}<small>%</small>`, `露点温度 ${now.dew || '—'}°`));
  cards.push(metricCard('风速', `${now.windSpeed}<small>公里/小时</small>`, `${now.windDir || ''} ${now.windScale || '—'}级`));
  cards.push(metricCard('气压', `${now.pressure}<small>百帕</small>`, '海平面气压'));
  cards.push(metricCard('能见度', `${now.vis}<small>公里</small>`, '水平能见度'));

  if (air) {
    const aqi = parseInt(air.aqi,10) || 0;
    const pct = Math.min(Math.max(aqi/300,0),1) * 100;
    cards.push(`
      <div class="metric-card glass" style="grid-column:span 2">
        <div class="m-label">空气质量 · ${AIR_CN(aqi)}</div>
        <div class="m-value">${air.aqi}<small>AQI</small></div>
        <div class="m-sub">首要污染物：${pollutantCN(air.primary) || '—'}</div>
        <div class="aqi-bar"><div class="aqi-dot" style="left:${pct}%"></div></div>
      </div>`);
  }
  return `<div class="metrics-grid">${cards.join('')}</div>`;
}
function pollutantCN(p) {
  const m = { pm2p5:'PM2.5', pm10:'PM10', o3:'臭氧', no2:'二氧化氮', so2:'二氧化硫', co:'一氧化碳' };
  return m[p] || p || '';
}
function metricCard(label, value, sub) {
  return `<div class="metric-card glass"><div class="m-label">${label}</div><div class="m-value">${value}</div>${sub?`<div class="m-sub">${sub}</div>`:''}</div>`;
}

/* ================================================================
   初始化
   ================================================================ */
(function init() {
  loadSettings();
  if (!state.apiKey) {
    openSettings();
    document.getElementById('mainContent').innerHTML='<div class="loading">点击右上角 ⚙ 填写和风天气凭据</div>';
  } else { initLocation(); }
})();
document.getElementById('settingsOverlay').addEventListener('click', e => { if(e.target===e.currentTarget) closeSettings(); });
</script>
