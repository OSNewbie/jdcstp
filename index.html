<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="检查公网 IP、网络位置、IPv6 连通性和 WebRTC 候选地址。">
  <title>网络诊断</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f7fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #fff; border-bottom: 1px solid #e5eaf1; }
    .wrap { width: min(920px, calc(100% - 32px)); margin: auto; }
    header .wrap { padding: 22px 0; }
    h1 { margin: 0; font-size: 22px; }
    main { padding: 28px 0 48px; }
    .intro { color: #5c667a; margin: 0 0 20px; }
    .card {
      background: #fff; border: 1px solid #e5eaf1; border-radius: 12px;
      padding: 20px; margin-bottom: 16px; box-shadow: 0 3px 12px #17203308;
    }
    h2 { font-size: 17px; margin: 0 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .item { min-width: 0; }
    .label { display: block; color: #687386; font-size: 13px; margin-bottom: 5px; }
    .value { overflow-wrap: anywhere; font-weight: 600; }
    .status { color: #687386; font-weight: 400; }
    .good { color: #137a49; }
    .warn { color: #a56300; }
    .bad { color: #bd3030; }
    button, .link {
      display: inline-block; border: 0; border-radius: 8px; padding: 10px 14px;
      background: #215fe5; color: white; font: inherit; text-decoration: none;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .subtle { color: #687386; font-size: 13px; line-height: 1.6; }
    ul { padding-left: 20px; margin-bottom: 0; }
    li { overflow-wrap: anywhere; margin: 6px 0; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap"><h1>网络诊断</h1></div>
  </header>

  <main class="wrap">
    <p class="intro">自动检查当前连接的公网网络信息。</p>

    <section class="card" aria-labelledby="ip-title">
      <h2 id="ip-title">公网 IP 与网络信息</h2>
      <div class="grid">
        <div class="item"><span class="label">公网 IP</span><div id="ip" class="value status">检测中…</div></div>
        <div class="item"><span class="label">位置</span><div id="location" class="value status">检测中…</div></div>
        <div class="item"><span class="label">ISP</span><div id="isp" class="value status">检测中…</div></div>
        <div class="item"><span class="label">ASN</span><div id="asn" class="value status">检测中…</div></div>
      </div>
    </section>

    <section class="card" aria-labelledby="ipv6-title">
      <h2 id="ipv6-title">IPv6 连通性</h2>
      <div id="ipv6" class="value status">检测中…</div>
      <p class="subtle">此项通过请求 IPv6 测试服务检测。若服务不可用，结果可能显示为检测失败。</p>
    </section>

    <section class="card" aria-labelledby="rtc-title">
      <h2 id="rtc-title">WebRTC 检查</h2>
      <div id="rtc-status" class="value status">检测中…</div>
      <ul id="rtc-list" class="subtle"></ul>
      <p class="subtle">浏览器可能会隐藏本地地址或限制 WebRTC；未显示地址不等于绝对不存在泄漏。</p>
    </section>

    <section class="card">
      <h2>DNS 泄漏检查</h2>
      <p class="subtle">DNS 检查由第三方页面执行，本网站不会自行搭建权威 DNS 检测服务。</p>
      <a class="link" href="https://www.ipleak.net/" target="_blank" rel="noopener noreferrer">前往 IPLeak.net 检查 DNS</a>
    </section>

    <button id="refresh" type="button">重新检测</button>
    <p id="page-error" class="subtle" role="status"></p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function setValue(id, value, className = "") {
      const el = $(id);
      el.textContent = value;
      el.className = "value " + className;
    }

    async function checkNetworkInfo() {
      $("page-error").textContent = "";
      $("refresh").disabled = true;

      for (const id of ["ip", "location", "isp", "asn"]) {
        setValue(id, "检测中…", "status");
      }

      try {
        const response = await fetch("/api/check", {
          method: "GET",
          headers: { "Accept": "application/json" },
          cache: "no-store"
        });
        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || "无法获取网络信息");
        }

        setValue("ip", data.ip || "未提供");
        setValue("location", data.location || "未提供");
        setValue("isp", data.isp || "未提供");
        setValue("asn", data.asn || "未提供");
      } catch (error) {
        for (const id of ["ip", "location", "isp", "asn"]) {
          setValue(id, "检测失败", "bad");
        }
        $("page-error").textContent = error.message || "网络信息请求失败，请稍后重试。";
      } finally {
        $("refresh").disabled = false;
      }
    }

    async function checkIPv6() {
      setValue("ipv6", "检测中…", "status");
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 7000);

      try {
        const response = await fetch("https://api6.ipify.org?format=json", {
          cache: "no-store",
          signal: controller.signal
        });
        if (!response.ok) throw new Error("IPv6 测试服务返回错误");
        const data = await response.json();

        if (!data.ip) throw new Error("未获得 IPv6 地址");
        setValue("ipv6", "已检测到 IPv6：" + data.ip, "good");
      } catch {
        setValue("ipv6", "未检测到 IPv6 连通性", "warn");
      } finally {
        clearTimeout(timer);
      }
    }

    function checkWebRTC() {
      const status = $("rtc-status");
      const list = $("rtc-list");
      list.replaceChildren();

      if (!window.RTCPeerConnection) {
        status.textContent = "此浏览器不支持 WebRTC。";
        status.className = "value warn";
        return;
      }

      status.textContent = "正在收集候选地址…";
      status.className = "value status";

      let finished = false;
      const candidates = new Set();
      let pc;

      const finish = () => {
        if (finished) return;
        finished = true;

        if (pc) pc.close();

        if (candidates.size) {
          status.textContent = "发现 WebRTC 候选地址（不一定代表公网 IP 泄漏）：";
          status.className = "value warn";
          for (const candidate of candidates) {
            const li = document.createElement("li");
            li.textContent = candidate;
            list.appendChild(li);
          }
        } else {
          status.textContent = "未收集到候选地址；浏览器可能隐藏或限制了地址。";
          status.className = "value good";
        }
      };

      try {
        // 不配置 STUN 服务器：仅检查浏览器本地生成的 ICE 候选项。
        pc = new RTCPeerConnection({ iceServers: [] });
        pc.createDataChannel("diagnostic");

        pc.onicecandidate = (event) => {
          if (!event.candidate) {
            finish();
            return;
          }

          const text = event.candidate.candidate || "";
          const match = text.match(/(?:\d{1,3}\.){3}\d{1,3}|[0-9a-f:]{3,}/i);
          if (match) candidates.add(match[0]);
        };

        pc.onicegatheringstatechange = () => {
          if (pc.iceGatheringState === "complete") finish();
        };

        pc.createOffer()
          .then((offer) => pc.setLocalDescription(offer))
          .catch(finish);

        setTimeout(finish, 5000);
      } catch {
        status.textContent = "无法启动 WebRTC 检查。";
        status.className = "value warn";
      }
    }

    function runChecks() {
      checkNetworkInfo();
      checkIPv6();
      checkWebRTC();
    }

    $("refresh").addEventListener("click", runChecks);
    runChecks();
  </script>
</body>
</html>
