<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a2a4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="天气">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.svg">
<title>和风天气</title>
<style>
  :root {
    --bg-a:#1a2a4a; --bg-b:#2d4a6b; --bg-c:#4a6fa5;
    --text-primary:#fff;
    --text-secondary:rgba(255,255,255,0.65);
    --glass-bg:rgba(255,255,255,0.10);
    --glass-border:rgba(255,255,255,0.18);
    --radius-card:20px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --tabbar-h: 58px;
    --api-bar-h: 26px;
    --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    --emoji-font: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Segoe UI Symbol", sans-serif;
  }
  .theme-clear  { --bg-a:#1e4a7a; --bg-b:#3a7bc8; --bg-c:#6aace0; }
  .theme-cloudy { --bg-a:#2a3a4a; --bg-b:#4a5a6a; --bg-c:#7a8a9a; }
  .theme-rain   { --bg-a:#1a2a3a; --bg-b:#2a4a5a; --bg-c:#4a6a7a; }
  .theme-snow   { --bg-a:#3a4a5a; --bg-b:#5a7a9a; --bg-c:#8aaac0; }
  .theme-night  { --bg-a:#0a1220; --bg-b:#152030; --bg-c:#1e2a40; }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html { overscroll-behavior-y: contain; }
  body { font-family: var(--font-stack); color: var(--text-primary); min-height: 100vh; background: linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 45%, var(--bg-c) 100%); transition: background 1.2s ease; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  .app { max-width: 480px; margin: 0 auto; position: relative; min-height: 100vh; }
  .glass { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: var(--radius-card); }
  .weather-emoji { font-family: var(--emoji-font); display: inline-block; line-height: 1; }

  .topbar { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 40; display: flex; align-items: center; justify-content: space-between; padding: calc(12px + var(--safe-top)) 16px 10px; background: linear-gradient(180deg, var(--bg-a) 0%, var(--bg-a) 70%, transparent 100%); }
  .topbar .city { font-size: 20px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .topbar .city small { font-weight: 400; font-size: 11px; color: var(--text-secondary); }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--glass-bg); border: 1px solid var(--glass-border); color: #fff; font-size: 18px; cursor: pointer; transition: transform 0.15s, background 0.2s; }
  .icon-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.22); }

  main { padding: calc(64px + var(--safe-top)) 16px calc(var(--tabbar-h) + var(--api-bar-h) + var(--safe-bottom) + 24px); }
  .view { display: none; animation: fadeIn 0.28s ease; }
  .view.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .warning-switch { display: flex; background: rgba(255,255,255,0.08); border-radius: 12px; padding: 3px; margin: 16px 0 14px; border: 1px solid rgba(255,255,255,0.10); }
  .ws-btn { flex: 1; padding: 9px 0; text-align: center; font-size: 13px; font-weight: 500; border-radius: 10px; cursor: pointer; color: var(--text-secondary); transition: background 0.2s, color 0.2s; user-select: none; }
  .ws-btn.active { background: rgba(255,255,255,0.18); color: #fff; font-weight: 600; }

  .warning-banner { display: flex; align-items: center; gap: 10px; padding: 12px 16px; margin-bottom: 12px; border-radius: 14px; background: rgba(255,160,80,0.18); border: 1px solid rgba(255,160,80,0.35); font-size: 13px; cursor: pointer; flex-wrap: wrap; }
  .warning-banner .w-icon { font-size: 18px; }
  .warning-banner .w-title { flex: 1; font-weight: 600; min-width: 0; }
  .warning-banner .w-severity { color: rgba(255,255,255,0.7); font-size: 11px; }
  .warning-detail { display: none; width: 100%; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,160,80,0.25); font-size: 12px; line-height: 1.7; color: rgba(255,255,255,0.85); }
  .warning-detail.show { display: block; }
  .warning-list-item { margin-bottom: 12px; }
  .w-region { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }

  .hero { text-align: center; padding: 24px 0 20px; }
  .hero .main-weather-icon { font-size: 68px; line-height: 1; margin-bottom: 8px; display: inline-block; animation: iconBreathe 4s ease-in-out infinite; }
  @keyframes iconBreathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .hero .temp { font-size: clamp(72px, 22vw, 104px); font-weight: 200; line-height: 1; letter-spacing: -4px; font-variant-numeric: tabular-nums; }
  .hero .temp sup { font-size: 32px; font-weight: 300; vertical-align: super; letter-spacing: 0; }
  .hero .condition { font-size: 18px; font-weight: 500; margin-top: 6px; }
  .hero .feels-like { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
  .hero .hi-lo { display: inline-flex; gap: 14px; margin-top: 10px; font-size: 13px; color: var(--text-secondary); }

  /* 一句话建议 */
  .advice-line { margin: 14px auto 0; padding: 10px 16px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); font-size: 12px; line-height: 1.6; color: rgba(255,255,255,0.88); display: inline-block; max-width: 92%; }

  .rain-banner { display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin-bottom: 16px; border-radius: 16px; background: rgba(126,200,227,0.15); border: 1px solid rgba(126,200,227,0.35); cursor: pointer; transition: transform 0.15s; }
  .rain-banner:active { transform: scale(0.98); }
  .rain-banner .rb-icon { font-size: 22px; }
  .rain-banner .rb-text { flex: 1; font-size: 13px; line-height: 1.5; }
  .rain-banner .rb-arrow { color: var(--text-secondary); font-size: 14px; }

  .section-label { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-secondary); padding: 0 4px 8px; }

  .hourly-card { padding: 16px 0 14px; margin-bottom: 18px; overflow: hidden; }
  .hourly-scroll { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 16px; scrollbar-width: none; }
  .hourly-scroll::-webkit-scrollbar { display: none; }
  .hour-item { flex: 0 0 64px; text-align: center; scroll-snap-align: start; position: relative; padding-bottom: 8px; }
  .hour-item .h-time { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; }
  .hour-item .h-icon { font-size: 26px; margin-bottom: 4px; line-height: 1; }
  .hour-item .h-text { font-size: 10px; color: var(--text-secondary); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hour-item .h-temp { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .hour-item.now .h-time { color: #fff; font-weight: 600; }
  .hour-item.now::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 18px; height: 2px; border-radius: 1px; background: #fff; }
  .h-pop { font-size: 9px; color: #7ec8e3; margin-top: 2px; }
  .h-pop-bar { height: 2px; border-radius: 1px; background: rgba(255,255,255,0.12); margin: 2px 12px 0; }
  .h-pop-bar > div { height: 100%; border-radius: 1px; background: #7ec8e3; }

  .daily-card { padding: 6px 16px; margin-bottom: 18px; }
  .day-row { display: flex; align-items: center; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .day-row:last-child { border-bottom: none; }
  .day-name { width: 48px; font-size: 14px; font-weight: 500; flex-shrink: 0; }
  .day-name.today { font-weight: 700; }
  .day-icon { width: 34px; text-align: center; font-size: 22px; flex-shrink: 0; }
  .day-text { width: 46px; font-size: 10px; color: var(--text-secondary); flex-shrink: 0; text-align: center; line-height: 1.3; }
  .day-rain { width: 52px; font-size: 10px; color: var(--text-secondary); text-align: right; flex-shrink: 0; line-height: 1.35; }
  .day-bar-wrap { flex: 1; display: flex; align-items: center; gap: 8px; margin: 0 8px; min-width: 0; }
  .day-lo, .day-hi { font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; width: 28px; flex-shrink: 0; }
  .day-lo { text-align: right; } .day-hi { text-align: left; color: #fff; font-weight: 600; }
  .bar-track { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12); position: relative; overflow: hidden; min-width: 36px; }
  .bar-fill { position: absolute; top: 0; bottom: 0; border-radius: 2px; background: linear-gradient(90deg, #7ec8e3, #ffd166); opacity: 0.85; }

  .rain-summary { padding: 20px 18px; margin-bottom: 16px; font-size: 15px; line-height: 1.6; }
  .rain-summary .rs-title { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; letter-spacing: 0.5px; }
  .rain-chart-card { padding: 20px 16px 14px; margin-bottom: 16px; }
  .rain-chart { display: flex; align-items: flex-end; gap: 2px; height: 120px; padding-bottom: 22px; position: relative; }
  .rain-bar-wrap { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; position: relative; }
  .rain-bar { width: 100%; border-radius: 2px 2px 0 0; background: linear-gradient(180deg, #7ec8e3, #4a9ec9); min-height: 0; transition: height 0.4s ease; }
  .rain-time { position: absolute; bottom: -20px; font-size: 9px; color: var(--text-secondary); white-space: nowrap; }
  .rain-chart-baseline { position: absolute; left: 0; right: 0; bottom: 22px; height: 1px; background: rgba(255,255,255,0.15); }
  .rain-empty { text-align: center; padding: 60px 20px; color: var(--text-secondary); font-size: 14px; line-height: 1.8; }
  .rain-empty .re-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.6; }

  .indices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .index-card { padding: 14px; border-radius: 16px; }
  .idx-type { font-size: 11px; color: var(--text-secondary); }
  .idx-category { font-size: 16px; font-weight: 600; margin: 4px 0; }
  .idx-text { font-size: 10px; color: var(--text-secondary); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .metric-card { padding: 14px 16px; border-radius: 16px; }
  .metric-card .m-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; }
  .metric-card .m-value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .metric-card .m-value small { font-size: 12px; font-weight: 400; color: var(--text-secondary); margin-left: 3px; }
  .metric-card .m-sub { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
  .aqi-bar { height: 3px; border-radius: 2px; margin-top: 8px; background: linear-gradient(90deg, #6bcf7f, #ffd93d, #ff9f43, #ff6b6b, #a55eea); position: relative; }
  .aqi-dot { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 8px; height: 8px; border-radius: 50%; background: #fff; border: 1.5px solid rgba(0,0,0,0.25); }
  .astro-card { display: flex; padding: 16px 0; margin-bottom: 18px; }
  .astro-item { flex: 1; text-align: center; }
  .astro-item .a-label { font-size: 10px; color: var(--text-secondary); margin-bottom: 4px; }
  .astro-item .a-value { font-size: 15px; font-weight: 600; }
  .astro-item .a-sub { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }

  /* 可信度卡片（结论优先） */
  .conf-card { padding: 20px 16px; margin-bottom: 18px; }
  .conf-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .conf-icon { font-size: 24px; line-height: 1; flex-shrink: 0; }
  .conf-title { font-size: 14px; font-weight: 600; line-height: 1.4; }
  .conf-temps { display: flex; justify-content: space-around; padding: 14px 0; border-top: 1px solid rgba(255,255,255,0.06); border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 12px; }
  .conf-temp-item { text-align: center; flex: 1; }
  .ct-val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ct-name { font-size: 10px; color: var(--text-secondary); margin-top: 3px; }
  .conf-meta { font-size: 11px; color: var(--text-secondary); line-height: 1.6; text-align: center; }
  .conf-warn { margin-top: 10px; padding: 8px 12px; border-radius: 10px; background: rgba(255,209,102,0.1); border: 1px solid rgba(255,209,102,0.3); font-size: 11px; line-height: 1.6; color: #ffd166; }
  .conf-detail { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06); }
  .conf-detail summary { font-size: 11px; color: var(--text-secondary); cursor: pointer; user-select: none; outline: none; }
  .conf-raw { margin-top: 10px; }
  .conf-raw-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; color: var(--text-secondary); }
  .conf-raw-row span:last-child { color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* WeatherAPI 补充结论 */
  .wa-mini { padding: 16px; margin-bottom: 18px; }
  .wa-mini-text { font-size: 14px; font-weight: 500; line-height: 1.6; margin-bottom: 10px; }
  .wa-mini-detail summary { font-size: 11px; color: var(--text-secondary); cursor: pointer; user-select: none; outline: none; }
  .wa-mini-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; font-size: 11px; color: var(--text-secondary); }
  .wa-mini-note { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.06); font-size: 10px; color: var(--text-secondary); line-height: 1.5; }

  .api-status-bar { position: fixed; bottom: calc(var(--tabbar-h) + var(--safe-bottom)); left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: var(--api-bar-h); background: rgba(16, 22, 34, 0.94); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; padding: 0 12px; gap: 6px; font-size: 10px; color: var(--text-secondary); z-index: 49; cursor: pointer; user-select: none; overflow: hidden; }
  .api-status-bar:active { background: rgba(24, 32, 46, 0.96); }
  .as-dot { width: 6px; height: 6px; border-radius: 50%; background: #6bcf7f; flex-shrink: 0; }
  .as-dot.warn { background: #ffd166; }
  .as-dot.err  { background: #ff6b6b; }
  .as-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; max-width: 45%; }
  .as-spacer { flex: 1; }
  .as-progress { flex: 0 0 50px; height: 3px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; position: relative; }
  .as-progress-fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #6bcf7f, #ffd93d); border-radius: 2px; transition: width 0.4s ease; }
  .as-progress-fill.warn { background: linear-gradient(90deg, #ffd166, #ff9f43); }
  .as-progress-fill.err  { background: linear-gradient(90deg, #ff9f43, #ff6b6b); }
  .as-count { font-variant-numeric: tabular-nums; color: #fff; font-weight: 600; flex-shrink: 0; }
  .as-expand-icon { font-size: 11px; margin-left: 2px; flex-shrink: 0; }

  .api-detail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(6px); display: none; z-index: 88; }
  .api-detail-overlay.show { display: block; }
  .api-detail-panel { position: fixed; bottom: calc(var(--tabbar-h) + var(--api-bar-h) + var(--safe-bottom)); left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; max-height: 70vh; overflow-y: auto; background: rgba(28,36,52,0.97); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-radius: 20px 20px 0 0; border: 1px solid rgba(255,255,255,0.12); border-bottom: none; padding: 18px 18px 16px; z-index: 89; }
  .adp-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .adp-sub { font-size: 11px; color: var(--text-secondary); margin-bottom: 14px; line-height: 1.5; }
  .adp-source { padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .adp-source:last-of-type { border-bottom: none; }
  .adp-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .adp-name { font-weight: 500; }
  .adp-total { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .adp-meta { font-size: 10px; color: var(--text-secondary); margin-bottom: 6px; }
  .adp-bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden; position: relative; }
  .adp-bar-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #6bcf7f, #ffd93d); transition: width 0.4s ease; }
  .adp-bar-fill.warn { background: linear-gradient(90deg, #ffd166, #ff9f43); }
  .adp-bar-fill.err  { background: linear-gradient(90deg, #ff9f43, #ff6b6b); }
  .adp-quota-note { font-size: 10px; color: var(--text-secondary); margin-top: 4px; }
  .adp-status-line { font-size: 11px; margin-top: 6px; padding: 6px 8px; border-radius: 6px; background: rgba(255,255,255,0.04); line-height: 1.5; }
  .adp-status-line.ok { color: #6bcf7f; }
  .adp-status-line.err { color: #ff6b6b; }
  .adp-status-line.warn { color: #ffd166; }
  .adp-actions { display: flex; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.08); }
  .adp-actions .btn { flex: 1; }

  .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; z-index: 50; display: flex; justify-content: space-around; align-items: center; height: calc(var(--tabbar-h) + var(--safe-bottom)); padding-bottom: var(--safe-bottom); background: rgba(20, 28, 42, 0.92); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-top: 1px solid rgba(255,255,255,0.08); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 100%; cursor: pointer; color: var(--text-secondary); font-size: 9px; transition: color 0.2s; user-select: none; }
  .tab .tab-icon { font-size: 18px; line-height: 1; transition: transform 0.2s; }
  .tab:active .tab-icon { transform: scale(0.88); }
  .tab.active { color: #fff; }
  .tab.active .tab-icon { transform: translateY(-1px); }

  .city-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 85; display: none; opacity: 0; transition: opacity 0.25s; }
  .city-backdrop.show { display: block; opacity: 1; }
  .city-sheet { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%); width: 100%; max-width: 480px; z-index: 90; background: rgba(28,36,52,0.97); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-radius: 24px 24px 0 0; border: 1px solid rgba(255,255,255,0.12); border-bottom: none; padding: 10px 16px calc(20px + var(--safe-bottom)); transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1); max-height: 80vh; display: flex; flex-direction: column; }
  .city-sheet.show { transform: translateX(-50%) translateY(0); }
  .cs-handle { width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2); margin: 0 auto 12px; flex-shrink: 0; }
  .cs-title { font-size: 17px; font-weight: 600; margin-bottom: 12px; flex-shrink: 0; }
  .cs-search { display: flex; align-items: center; padding: 8px 8px 8px 16px; gap: 8px; margin-bottom: 10px; flex-shrink: 0; }
  .cs-search input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 14px; font-family: var(--font-stack); }
  .cs-search input::placeholder { color: rgba(255,255,255,0.4); }
  .cs-search button { background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: var(--font-stack); }
  .cs-list { flex: 1; overflow-y: auto; min-height: 100px; }
  .cs-item { display: flex; align-items: center; padding: 14px 4px; border-bottom: 1px solid rgba(255,255,255,0.06); cursor: pointer; }
  .cs-item:last-child { border-bottom: none; }
  .cs-item.active .cs-name { color: #7ec8e3; }
  .cs-info { flex: 1; min-width: 0; }
  .cs-name { font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .cs-sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  .cs-tag { font-size: 10px; color: #7ec8e3; background: rgba(126,200,227,0.15); padding: 1px 6px; border-radius: 4px; font-weight: 400; }

  .settings-overlay.show { display: flex; }

  .settings-panel h3 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  .settings-panel .hint { font-size: 12px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; }

  .settings-panel input:focus { border-color: rgba(255,255,255,0.45); }

  @keyframes spin { to { transform: rotate(360deg); } }

<script>
const KEY_API='qweather_api_key', KEY_HOST='qweather_api_host', KEY_WA='weatherapi_key';
const KEY_CITIES='qweather_cities', KEY_ACTIVE='qweather_active_index';
const KEY_API_STATS='qweather_api_stats';
const QWEATHER_MONTHLY_QUOTA = 50000;
const WEATHERAPI_MONTHLY_QUOTA = 100000;

const state = { apiKey:'', apiHost:'', waKey:'', cities:[], activeIndex:0, data:null };
let currentTab = 'home';
let loadSeq = 0;
let warningViewMode = 'local';
let lastWaStatus = { status: '未调用', time: '', ok: null };

function nowStr() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}

/* ================================================================
   API 统计（与之前一致）
   ================================================================ */
function getMonthKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function emptyStats() {
  return { month: getMonthKey(), sources: { qweather:{ok:0,fail:0}, openmeteo:{ok:0,fail:0}, weatherapi:{ok:0,fail:0}, nmc:{ok:0,fail:0} } };
}
function loadApiStats() {
  try { const raw = localStorage.getItem(KEY_API_STATS); if (raw) { const s = JSON.parse(raw); if (s && s.month === getMonthKey() && s.sources) return s; } } catch {}
  return emptyStats();
}
function saveApiStats(s) { try { localStorage.setItem(KEY_API_STATS, JSON.stringify(s)); } catch {} }
let apiStats = loadApiStats();

function trackApi(source, ok) {
  const current = getMonthKey();
  if (apiStats.month !== current) apiStats = emptyStats();
  if (!apiStats.sources[source]) apiStats.sources[source] = { ok:0, fail:0 };
  if (ok) apiStats.sources[source].ok++; else apiStats.sources[source].fail++;
  saveApiStats(apiStats);
  updateApiStatusBar();
}
async function trackedFetch(url, source) {
  try { const r = await fetch(url); trackApi(source, r.ok); return r; }
  catch (e) { trackApi(source, false); throw e; }
}
async function fetchJson(url, source = 'qweather') {
  const r = await trackedFetch(url, source);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

/* ================================================================
   WeatherAPI 测试
   ================================================================ */
async function testWeatherAPI(key) {
  if (!key) return { ok: false, error: '未配置 Key' };
  try {
    const url = `https://api.weatherapi.com/v1/current.json?key=${encodeURIComponent(key)}&q=London`;
    const res = await fetch(url);
    if (!res.ok) return { ok: false, error: `HTTP ${res.status}` };
    const data = await res.json();
    if (data.error) return { ok: false, error: data.error.message || '未知错误' };
    return { ok: true, temp: data.current?.temp_c, city: data.location?.name };
  } catch (e) { return { ok: false, error: e.message }; }
}
async function testWeatherApiFromPanel() {
  const key = state.waKey;
  if (!key) { alert('请先在设置中填写并保存 WeatherAPI Key'); return; }
  const btn = document.getElementById('testWaBtn');
  if (btn) { btn.textContent = '测试中…'; btn.disabled = true; }
  const r = await testWeatherAPI(key);
  if (btn) { btn.textContent = '测试 WeatherAPI'; btn.disabled = false; }
  if (r.ok) alert(`✅ WeatherAPI 测试成功\n返回城市：${r.city}\n当前温度：${r.temp}°C`);
  else alert(`❌ WeatherAPI 测试失败\n原因：${r.error}`);
}

/* ================================================================
   状态条 UI
   ================================================================ */
function computeTotals(sources) {
  let ok = 0, fail = 0;
  Object.values(sources).forEach(s => { ok += s.ok; fail += s.fail; });
  return { ok, fail, total: ok + fail };
}
function getHealthClass(ok, fail) {
  const total = ok + fail;
  if (!total) return '';
  if (fail / total > 0.05) return 'err';
  if (fail > 0) return 'warn';
  return '';
}
function updateApiStatusBar() {
  const qw = apiStats.sources.qweather || { ok:0, fail:0 };
  const wa = apiStats.sources.weatherapi || { ok:0, fail:0 };
  const om = apiStats.sources.openmeteo || { ok:0, fail:0 };
  const nmc = apiStats.sources.nmc || { ok:0, fail:0 };
  const qwUsed = qw.ok + qw.fail, waUsed = wa.ok + wa.fail, omUsed = om.ok + om.fail, nmcUsed = nmc.ok + nmc.fail;
  const pct = Math.min(100, (qwUsed / QWEATHER_MONTHLY_QUOTA) * 100);
  const totals = computeTotals(apiStats.sources);
  let health = getHealthClass(totals.ok, totals.fail);
  if (state.waKey && waUsed === 0 && qwUsed > 0) health = 'warn';

  document.getElementById('asDot').className = 'as-dot' + (health ? ' ' + health : '');
  const parts = [`和风 ${qwUsed}`];
  if (state.waKey) parts.push(waUsed > 0 ? `WA ${waUsed}` : 'WA 未生效');
  else if (waUsed > 0) parts.push(`WA ${waUsed}`);
  if (omUsed + nmcUsed > 0) parts.push(`其他 ${omUsed + nmcUsed}`);
  document.getElementById('asText').textContent = parts.join(' · ');

  const fill = document.getElementById('asProgressFill');
  fill.style.width = pct.toFixed(1) + '%';
  fill.className = 'as-progress-fill' + (pct >= 80 ? ' err' : pct >= 50 ? ' warn' : '');
  document.getElementById('asCount').textContent = qwUsed + '/' + QWEATHER_MONTHLY_QUOTA;
}
function toggleApiDetail() {
  const overlay = document.getElementById('apiDetailOverlay');
  const panel = document.getElementById('apiDetailPanel');
  if (overlay.classList.contains('show')) { overlay.classList.remove('show'); panel.style.display = 'none'; }
  else { renderApiDetail(); overlay.classList.add('show'); panel.style.display = 'block'; }
}
function renderApiDetail() {
  const box = document.getElementById('adpSources'); if (!box) return;
  const defs = [
    { key:'qweather', name:'和风天气', quota:QWEATHER_MONTHLY_QUOTA, quotaLabel:'免费额度 50,000 次/月' },
    { key:'weatherapi', name:'WeatherAPI', quota:WEATHERAPI_MONTHLY_QUOTA, quotaLabel: state.waKey ? '免费层 10 万次/月' : '未配置' },
    { key:'openmeteo', name:'Open-Meteo', quota:null, quotaLabel:'免费层 · 无硬性上限' },
    { key:'nmc', name:'中央气象台', quota:null, quotaLabel:'官方公开接口' },
  ];
  box.innerHTML = defs.map(def => {
    const s = apiStats.sources[def.key] || { ok:0, fail:0 };
    const total = s.ok + s.fail;
    const health = getHealthClass(s.ok, s.fail);
    const pct = def.quota ? Math.min(100, (total / def.quota) * 100) : (total > 0 ? Math.min(100, (s.ok / total) * 100) : 0);
    let statusLine = '';
    if (def.key === 'weatherapi') {
      if (!state.waKey) statusLine = `<div class="adp-status-line warn">未配置 WeatherAPI Key。</div>`;
      else if (lastWaStatus.ok === true) statusLine = `<div class="adp-status-line ok">最近请求成功（${lastWaStatus.time}）</div>`;
      else if (lastWaStatus.ok === false) statusLine = `<div class="adp-status-line err">最近请求失败 · ${lastWaStatus.status}（${lastWaStatus.time}）</div>`;
      else statusLine = `<div class="adp-status-line warn">已配置 Key，尚未发起请求。</div>`;
    }
    return `<div class="adp-source">
      <div class="adp-row"><span class="adp-name">${def.name}</span><span class="adp-total">${total} 次</span></div>
      <div class="adp-meta">成功 ${s.ok} · 失败 ${s.fail} · ${def.quotaLabel}</div>
      <div class="adp-bar"><div class="adp-bar-fill ${health}" style="width:${pct.toFixed(2)}%"></div></div>
      ${def.quota ? `<div class="adp-quota-note">已用 ${total} / ${def.quota}（${pct.toFixed(2)}%）</div>` : ''}
      ${statusLine}
    </div>`;
  }).join('');
}
function resetApiStats() {
  if (!confirm('确定重置本月 API 调用统计？')) return;
  apiStats = emptyStats(); saveApiStats(apiStats); updateApiStatusBar(); renderApiDetail();
}

/* ================================================================
   天气图标
   ================================================================ */
function weatherEmoji(code) {
  const c = String(code || ''), n = parseInt(c, 10);
  if (['150','151','152','153'].includes(c)) return '🌙';
  if (c === '100') return '☀️';
  if (['101','102','103'].includes(c)) return '⛅';
  if (c === '104') return '☁️';
  if (['300','305'].includes(c)) return '🌦️';
  if (['302','303','304'].includes(c)) return '⛈️';
  if (['306','307','308','309','310','311','312','313','314','315','316','317','318','399'].includes(c)) return '🌧️';
  if (n >= 400 && n < 500) return '❄️';
  if (['503','504','507','508'].includes(c)) return '🌪️';
  if (n >= 500 && n < 600) return '🌫️';
  if (n >= 300 && n < 400) return '🌧️';
  if (n >= 100 && n < 200) return '☁️';
  return '🌡️';
}
function iconHtml(code) { return `<span class="weather-emoji">${weatherEmoji(code)}</span>`; }

/* ================================================================
   多源融合分析（核心新增）
   ================================================================ */

// 融合温度：加权平均 + 动态权重 + 分歧度计算
function fuseTemperature(sources, mae) {
  let wQw = 0.6, wOm = 0.2, wWa = 0.2;
  if (mae) {
    if (mae.mae < 1.5) { wQw = 0.5; wOm = 0.3; wWa = 0.2; }
    else if (mae.mae > 3) { wQw = 0.7; wOm = 0.1; wWa = 0.2; }
  }
  const items = [];
  if (typeof sources.qweather === 'number' && !isNaN(sources.qweather)) items.push({ t: sources.qweather, w: wQw });
  if (typeof sources.openMeteo === 'number' && !isNaN(sources.openMeteo)) items.push({ t: sources.openMeteo, w: wOm });
  if (typeof sources.weatherApi === 'number' && !isNaN(sources.weatherApi)) items.push({ t: sources.weatherApi, w: wWa });

  if (items.length < 2) return null;

  const totalW = items.reduce((s, x) => s + x.w, 0);
  const fusedTemp = items.reduce((s, x) => s + x.t * x.w, 0) / totalW;
  const values = items.map(x => x.t);
  const mean = values.reduce((a, b) => a + b, 0) / values.length;
  const variance = values.reduce((s, t) => s + (t - mean) ** 2, 0) / values.length;
  const spread = Math.sqrt(variance);

  return {
    temp: Math.round(fusedTemp * 10) / 10,
    spread: parseFloat(spread.toFixed(1)),
    confidence: spread < 1 ? 'high' : spread < 2 ? 'mid' : 'low',
    sourceCount: items.length,
  };
}

// 天气现象投票
function voteWeather(qwIcon, waText) {
  const cat = (code) => {
    const c = String(code || '');
    if (c === '100' || c === '150') return '晴';
    if (c.startsWith('10')) return '多云';
    if (c.startsWith('3')) return '雨';
    if (c.startsWith('4')) return '雪';
    if (c.startsWith('5')) return '雾霾';
    if (waText) return waText.includes('雨') ? '雨' : waText.includes('雪') ? '雪' : waText.includes('云') ? '多云' : '其他';
    return '其他';
  };
  const votes = [cat(qwIcon)];
  if (waText) votes.push(cat(null, waText));
  const counts = {};
  votes.forEach(v => counts[v] = (counts[v] || 0) + 1);
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  return { category: top?.[0] || '未知', agreement: top?.[1] || 0, total: votes.length };
}

// 降水融合（最大值作为风险提示）
function fusePrecipitation(pops) {
  const valid = pops.filter(p => typeof p === 'number' && !isNaN(p));
  if (!valid.length) return null;
  const avg = valid.reduce((a, b) => a + b, 0) / valid.length;
  const max = Math.max(...valid);
  const min = Math.min(...valid);
  return {
    average: Math.round(avg),
    maxRisk: max,
    hasDisagreement: (max - min) > 30,
    spread: max - min,
  };
}

// 一句话生活建议（安全 > 便利 > 舒适）
function buildAdvice(fused, weatherVote, precip, now, daily, air) {
  const temp = fused ? fused.temp : parseFloat(now.temp);
  const wind = parseInt(now.windScale || 0, 10);
  const aqi = air ? parseInt(air.aqi, 10) : null;
  const tips = [];

  // 安全优先（独占一句）
  if (temp >= 35) return '🔥 高温预警，避免长时间户外活动';
  if (temp <= -5) return '🥶 严寒天气，注意防寒保暖';
  if (wind >= 7) return '💨 风力较大，注意高空坠物和出行安全';
  if (aqi != null && aqi > 200) return '😷 空气污染严重，建议减少户外活动';

  // 便利次之
  if (precip && precip.maxRisk >= 60) tips.push('🌧 多源预报有雨，出门带伞');
  else if (precip && precip.hasDisagreement) tips.push('🌂 降水预报有分歧，建议备伞');
  else if (daily && parseInt(daily[0]?.pop || 0, 10) >= 50) tips.push('🌧 降水概率较高，出门带伞');

  // 舒适最后
  if (temp >= 30) tips.push('🥵 天气炎热，注意补水');
  else if (temp <= 5) tips.push('🧥 天气较冷，穿厚外套');
  else if (temp >= 18 && temp <= 26) tips.push('😊 温度舒适，适合户外');

  // 分歧提示（占剩余位置）
  if (fused && fused.confidence === 'low' && tips.length < 2) {
    tips.push('⚠️ 多源预报存在分歧，实际天气可能有波动');
  }

  return tips.slice(0, 2).join(' · ') || '🌤 天气平稳，适合日常出行';
}

/* ================================================================
   设置 / 城市 / 预警 / 数据获取（保持原样）
   ================================================================ */
function loadSettings() {
  state.apiKey = localStorage.getItem(KEY_API) || '';
  state.apiHost = localStorage.getItem(KEY_HOST) || '';
  state.waKey = localStorage.getItem(KEY_WA) || '';
  try { const arr = JSON.parse(localStorage.getItem(KEY_CITIES) || '[]'); if (Array.isArray(arr)) state.cities = arr.filter(c => c && c.id); } catch {}
  const idx = parseInt(localStorage.getItem(KEY_ACTIVE) || '0', 10);
  state.activeIndex = Math.min(Math.max(idx, 0), Math.max(state.cities.length - 1, 0));
}
function saveCities() { localStorage.setItem(KEY_CITIES, JSON.stringify(state.cities)); localStorage.setItem(KEY_ACTIVE, String(state.activeIndex)); }
async function saveSettings() {
  const key = document.getElementById('apiKeyInput').value.trim();
  const host = document.getElementById('apiHostInput').value.trim();
  const wa = document.getElementById('weatherApiKeyInput').value.trim();
  if (!key) { alert('请填写和风天气 API Key'); return; }
  localStorage.setItem(KEY_API, key); localStorage.setItem(KEY_HOST, host); localStorage.setItem(KEY_WA, wa);
  state.apiKey = key; state.apiHost = host; state.waKey = wa;
  if (wa) {
    const r = await testWeatherAPI(wa);
    if (r.ok) alert(`✅ WeatherAPI 已保存，测试成功\n返回温度：${r.temp}°C`);
    else alert(`⚠️ WeatherAPI 测试失败：${r.error}`);
  }
  closeSettings(); updateApiStatusBar();
  state.cities.length ? loadWeather() : initLocation();
}
function openSettings() {
  document.getElementById('apiKeyInput').value = state.apiKey;
  document.getElementById('apiHostInput').value = state.apiHost;
  document.getElementById('weatherApiKeyInput').value = state.waKey;

function initLocation() {

    const lon = pos.coords.longitude.toFixed(2), lat = pos.coords.latitude.toFixed(2); const { geo } = getHosts();
    try {
      const data = await fetchJson(`${geo}/geo/v2/city/lookup?location=${lon},${lat}&number=1&lang=zh&key=${state.apiKey}`);

      } else fallbackBeijing();

  }, () => fallbackBeijing(), { timeout: 6000, maximumAge: 600000 });

function formatWarningItem(a) {

  const detailUrl = a.alertid ? `https://www.nmc.cn/publish/alarm/${a.alertid}.html` : (a.url ? `https://www.nmc.cn${a.url}` : '');
  const regionMatch = title.match(/^(.+?(?:省|市|县|区|旗|盟))气象台/);
  return { title, issuetime, detailUrl, region: regionMatch ? regionMatch[1] : '' };
}
async function loadLocalWarnings(city) {

  try {
    const res = await trackedFetch(`https://www.nmc.cn/rest/findAlarm?pageNo=1&pageSize=50&signaltype=&signallevel=&province=`, 'nmc');

    if (!Array.isArray(list)) return [];

}
async function loadNationwideWarnings() {

async function fetchOpenMeteo(city) {
  if (!city.lon || !city.lat) return null;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m&timezone=auto`;
    const res = await trackedFetch(url, 'openmeteo'); if (!res.ok) return null;
    const data = await res.json(); const t = data.current?.temperature_2m;
    return t != null ? parseFloat(t) : null;
  } catch { return null; }
}
async function fetchWeatherApiFull(city) {
  if (!state.waKey) { lastWaStatus = { status: '未配置 Key', time: nowStr(), ok: false }; return null; }
  if (!city.lat || !city.lon) { lastWaStatus = { status: '城市缺少经纬度', time: nowStr(), ok: false }; return null; }
  try {
    const url = `https://api.weatherapi.com/v1/forecast.json?key=${encodeURIComponent(state.waKey)}&q=${city.lat},${city.lon}&days=3&aqi=yes&alerts=yes&lang=zh`;
    const res = await trackedFetch(url, 'weatherapi');

    const data = await res.json();
    if (data.error) { lastWaStatus = { status: `错误：${data.error.message}`, time: nowStr(), ok: false }; return null; }
    lastWaStatus = { status: '成功', time: nowStr(), ok: true };
    return data;
  } catch (e) { lastWaStatus = { status: `网络错误：${e.message}`, time: nowStr(), ok: false }; return null; }
}

async function fetchHistoricalMAE(city, days = 7) {
  if (!city.lon || !city.lat) return null;
  const end = new Date(); end.setDate(end.getDate() - 2);
  const start = new Date(end); start.setDate(start.getDate() - days + 1);
  const fmt = d => d.toISOString().slice(0, 10);
  try {
    const [prevRes, archRes] = await Promise.all([
      trackedFetch(`https://previous-runs-api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&hourly=temperature_2m_previous_day1&start_date=${fmt(start)}&end_date=${fmt(end)}&models=gfs_seamless`, 'openmeteo'),
      trackedFetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${city.lat}&longitude=${city.lon}&hourly=temperature_2m&start_date=${fmt(start)}&end_date=${fmt(end)}`, 'openmeteo'),
    ]);
    if (!prevRes.ok || !archRes.ok) return null;
    const prevData = await prevRes.json(), archData = await archRes.json();
    const prev = prevData?.hourly?.temperature_2m_previous_day1 || [], actual = archData?.hourly?.temperature_2m || [];
    if (!prev.length || prev.length !== actual.length) return null;
    let sum = 0, n = 0;
    for (let i = 0; i < prev.length; i++) if (prev[i] != null && actual[i] != null) { sum += Math.abs(prev[i] - actual[i]); n++; }
    if (!n) return null;
    const mae = sum / n;
    return { mae: parseFloat(mae.toFixed(2)), accuracy: Math.max(0, Math.min(100, Math.round(100 - mae * 7))), days: Math.round(n / 24) };
  } catch { return null; }
}

async function ensureCityCoords(city) {
  if (!city) return city;
  if (city.lon && city.lat && !isNaN(city.lon) && !isNaN(city.lat)) return city;
  if (!city.id || !state.apiKey) return city;
  try {
    const { geo } = getHosts();
    const res = await fetchJson(`${geo}/geo/v2/city/lookup?location=${city.id}&number=1&lang=zh&key=${state.apiKey}`);
    if (res.code === '200' && res.location?.length) {
      const l = res.location[0];
      city.lon = parseFloat(l.lon); city.lat = parseFloat(l.lat); city.adcode = city.adcode || l.adcode || '';
      state.cities[state.activeIndex] = city; saveCities();
    }
  } catch {}
  return city;
}

/* ================================================================
   天气加载（含融合分析）
   ================================================================ */
async function loadWeather() {
  let city = getActiveCity();
  if (!city) { document.getElementById('homeContent').innerHTML = '<div class="loading">请先添加城市</div>'; return; }
  city = await ensureCityCoords(city);
  const seq = ++loadSeq;
  document.getElementById('homeContent').innerHTML = '<div class="loading"><div class="spinner"></div>加载中…</div>';

  const localWarningsPromise = loadLocalWarnings(city);
  const nationwideWarningsPromise = loadNationwideWarnings();
  const openMeteoPromise = fetchOpenMeteo(city);
  const weatherApiFullPromise = fetchWeatherApiFull(city);
  const maePromise = fetchHistoricalMAE(city, 7);

  const { api } = getHosts(); const key = state.apiKey, loc = city.id;
  const coord = city.lon && city.lat ? `${city.lon},${city.lat}` : null;
  const tasks = [
    fetchJson(`${api}/v7/weather/now?location=${loc}&key=${key}`),
    fetchJson(`${api}/v7/weather/24h?location=${loc}&key=${key}`),
    fetchJson(`${api}/v7/weather/7d?location=${loc}&key=${key}`),
    fetchJson(`${api}/v7/air/now?location=${loc}&key=${key}`),
    fetchJson(`${api}/v7/indices/1d?location=${loc}&type=0&key=${key}`),
  ];
  if (coord) tasks.push(fetchJson(`${api}/v7/minutely/5m?location=${coord}&key=${key}`));
  else tasks.push(Promise.resolve(null));
  tasks.push(fetchJson(`${api}/v7/astronomy/sun?location=${loc}&key=${key}`));
  tasks.push(fetchJson(`${api}/v7/astronomy/moon?location=${loc}&key=${key}`));

  const [r, localWarnings, nationwideWarnings, omTemp, waFull, mae] = await Promise.all([
    Promise.allSettled(tasks), localWarningsPromise, nationwideWarningsPromise, openMeteoPromise, weatherApiFullPromise, maePromise
  ]);
  if (seq !== loadSeq) return;

  const nowData = r[0].status==='fulfilled' ? r[0].value : null;
  const dailyData = r[2].status==='fulfilled' ? r[2].value : null;
  if (!nowData || nowData.code !== '200' || !dailyData || dailyData.code !== '200') {
    const code = nowData?.code || dailyData?.code || 'NETWORK';
    let msg = `加载失败（${code}）`;
    if (code === '401' || code === '403') msg = 'API Key 无效或 Host 不正确';
    document.getElementById('homeContent').innerHTML = `<div class="loading">${msg}<br><button class="btn btn-ghost" style="max-width:160px;margin:12px auto 0" onclick="loadWeather()">重试</button></div>`;
    return;
  }

  const qwTemp = parseFloat(nowData.now.temp);
  const waTemp = waFull?.current?.temp_c != null ? parseFloat(waFull.current.temp_c) : null;
  const sources = { qweather: qwTemp, openMeteo: omTemp, weatherApi: waTemp };

  // 融合分析
  const fused = fuseTemperature(sources, mae);
  const weatherVote = voteWeather(nowData.now.icon, waFull?.current?.condition?.text);
  const precip = fusePrecipitation([
    parseInt(dailyData.daily[0]?.pop || 0, 10),
    waFull?.forecast?.forecastday?.[0]?.day?.daily_chance_of_rain ?? null,
  ]);

  state.data = {
    city, now: nowData.now,
    hourly: r[1].status==='fulfilled' && r[1].value?.code==='200' ? r[1].value.hourly : [],
    daily: dailyData.daily,
    air: r[3].status==='fulfilled' && r[3].value?.code==='200' ? r[3].value.now : null,
    indices: r[4].status==='fulfilled' && r[4].value?.code==='200' ? r[4].value.daily : [],
    localWarnings, nationwideWarnings,
    minutely: r[5].status==='fulfilled' && r[5].value?.code==='200' ? r[5].value : null,
    sun: r[6].status==='fulfilled' && r[6].value?.code==='200' ? r[6].value.daily?.[0] : null,
    moon: r[7].status==='fulfilled' && r[7].value?.code==='200' ? r[7].value.moonPhase?.[0] : null,
    sources, consensus: fused, mae, weatherVote, precip,
    weatherApiFull: waFull,
  };
  renderAll();
}

function renderAll() {

}
function setTheme(iconCode) {
  const c = String(iconCode); document.body.className = '';
  if (['150','151','153'].includes(c)) document.body.classList.add('theme-night');
  else if (c.startsWith('1')) document.body.classList.add('theme-clear');
  else if (c.startsWith('3')) document.body.classList.add('theme-rain');
  else if (c.startsWith('4')) document.body.classList.add('theme-snow');

/* ================================================================
   首页（含建议行）
   ================================================================ */
function buildHome(d) {
  const today = d.daily[0] || {};
  const hasRain = checkHasRain(d.minutely);
  const advice = buildAdvice(d.consensus, d.weatherVote, d.precip, d.now, d.daily, d.air);
  return `
    ${buildWarningBanner(d.localWarnings)}
    <div class="hero">
      <div class="main-weather-icon">${iconHtml(d.now.icon)}</div>

      <div class="advice-line">${advice}</div>
    </div>
    ${hasRain ? buildRainBanner(d.minutely) : ''}

}
function buildWarningBanner(alerts) {
  if (!alerts?.length) return '';
  const a = alerts[0];
  return `<div class="warning-banner" onclick="this.querySelector('.warning-detail').classList.toggle('show')">
    <span class="w-icon">⚠</span><span class="w-title">${a.title}</span><span class="w-severity">${a.issuetime}</span>
    <div class="warning-detail">${a.detailUrl ? `<div><a href="${a.detailUrl}" target="_blank" rel="noopener" style="color:#7ec8e3">查看详情 ›</a></div>` : ''}<div style="margin-top:6px;font-size:11px;opacity:0.6">来源：中央气象台</div></div>
  </div>`;
}
function checkHasRain(m) {
  if (!m) return false;
  if (m.summary && (m.summary.includes('雨') || m.summary.includes('雪') || m.summary.includes('降水'))) return true;
  if (m.minutely && m.minutely.some(x => parseFloat(x.precip) > 0)) return true;
  return false;
}
function buildRainBanner(m) { return `<div class="rain-banner" onclick="switchTab('rain')"><span class="rb-icon">🌧</span><span class="rb-text">${m.summary || '未来 2 小时有降水'}</span><span class="rb-arrow">›</span></div>`; }
function buildHourly(hourly) {
  if (!hourly?.length) return '';
  const items = hourly.slice(0, 24).map((h, i) => {
    const t = new Date(h.fxTime); const label = i === 0 ? '现在' : `${String(t.getHours()).padStart(2, '0')}:00`;
    const pop = parseInt(h.pop, 10) || 0;
    return `<div class="hour-item ${i === 0 ? 'now' : ''}"><div class="h-time">${label}</div><div class="h-icon">${iconHtml(h.icon)}</div><div class="h-text">${h.text || ''}</div><div class="h-temp">${h.temp}°</div>${pop > 0 ? `<div class="h-pop">降水 ${pop}%</div><div class="h-pop-bar"><div style="width:${Math.min(pop,100)}%"></div></div>` : ''}</div>`;
  }).join('');
  return `<div class="section-label">逐小时（未来 24 小时）</div><div class="hourly-card glass"><div class="hourly-scroll">${items}</div></div>`;
}
const UV_CN = v => { const n = parseInt(v, 10); if (isNaN(n)) return ''; return n <= 2 ? '弱' : n <= 4 ? '中等' : n <= 6 ? '强' : n <= 9 ? '很强' : '极强'; };
function buildDaily(daily) {
  if (!daily?.length) return '';
  const lows = daily.map(d => parseInt(d.tempMin, 10)), highs = daily.map(d => parseInt(d.tempMax, 10));
  const gMin = Math.min(...lows), gMax = Math.max(...highs), span = Math.max(gMax - gMin, 1);
  const W = ['周日','周一','周二','周三','周四','周五','周六'];
  const rows = daily.map((d, i) => {
    const lo = parseInt(d.tempMin, 10), hi = parseInt(d.tempMax, 10);
    const left = ((lo - gMin) / span) * 100, width = Math.max(((hi - lo) / span) * 100, 6);
    const dt = new Date(d.fxDate + 'T00:00:00'); const label = i === 0 ? '今天' : W[dt.getDay()];
    const meta = [];
    if (d.precip && parseFloat(d.precip) > 0) meta.push(`${d.precip}毫米`);
    if (d.uvIndex) meta.push(`UV ${UV_CN(d.uvIndex)}`);
    return `<div class="day-row"><div class="day-name ${i === 0 ? 'today' : ''}">${label}</div><div class="day-icon">${iconHtml(d.iconDay)}</div><div class="day-text">${d.textDay || ''}</div><div class="day-rain">${meta.join('<br>')}</div><div class="day-bar-wrap"><span class="day-lo">${lo}°</span><div class="bar-track"><div class="bar-fill" style="left:${left}%;width:${width}%"></div></div><span class="day-hi">${hi}°</span></div></div>`;
  }).join('');
  return `<div class="daily-card glass">${rows}</div>`;
}

/* 降雨 / 预警 / 指数 保持原样 */
function buildRainPage(m) {
  if (!m || (!m.summary && !m.minutely?.length)) return `<div class="rain-empty"><div class="re-icon">☀️</div>当前无降水<br><span style="font-size:12px;opacity:0.6">未来 2 小时内暂无降水数据</span></div>`;
  const summary = m.summary || '未来 2 小时降水情况';
  const max = Math.max(...m.minutely.map(y => parseFloat(y.precip) || 0), 0.1);
  const bars = m.minutely?.map((x, i) => {
    const v = parseFloat(x.precip) || 0, h = v > 0 ? Math.max((v / max) * 100, 5) : 0;
    const t = new Date(x.fxTime), label = i % 6 === 0 ? `${t.getHours()}:${String(t.getMinutes()).padStart(2, '0')}` : '';
    return `<div class="rain-bar-wrap"><div class="rain-bar" style="height:${h}%"></div>${label ? `<div class="rain-time">${label}</div>` : ''}</div>`;
  }).join('') || '';
  return `<div class="rain-summary glass"><div class="rs-title">未来 2 小时</div>${summary}</div><div class="rain-chart-card glass"><div class="section-label" style="padding-left:0">降水趋势（每 5 分钟）</div><div class="rain-chart"><div class="rain-chart-baseline"></div>${bars}</div></div>`;
}
function buildWarningPage(d) {
  const local = d.localWarnings || [], nationwide = d.nationwideWarnings || [];
  const list = warningViewMode === 'local' ? local : nationwide;
  const cityName = d.city.name;
  const switchHtml = `<div class="warning-switch"><div class="ws-btn ${warningViewMode === 'local' ? 'active' : ''}" onclick="switchWarningView('local')">当前地区 · ${cityName}</div><div class="ws-btn ${warningViewMode === 'nationwide' ? 'active' : ''}" onclick="switchWarningView('nationwide')">全国预警 (${nationwide.length})</div></div>`;
  if (!list.length) return switchHtml + (warningViewMode === 'local' ? `<div class="rain-empty"><div class="re-icon">✅</div>${cityName} 当前无生效预警</div>` : `<div class="rain-empty"><div class="re-icon">✅</div>全国当前无生效预警</div>`);
  const items = list.map(a => {
    const regionTag = warningViewMode === 'nationwide' && a.region ? `<div class="w-region">📍 ${a.region}</div>` : '';
    return `<div class="warning-list-item"><div class="warning-banner" onclick="this.querySelector('.warning-detail').classList.toggle('show')"><span class="w-icon">⚠</span><div style="flex:1;min-width:0"><span class="w-title">${a.title}</span>${regionTag}</div><span class="w-severity">${a.issuetime}</span><div class="warning-detail">${a.detailUrl ? `<div><a href="${a.detailUrl}" target="_blank" rel="noopener" style="color:#7ec8e3">查看详情 ›</a></div>` : ''}<div style="margin-top:6px;font-size:11px;opacity:0.6">来源：中央气象台</div></div></div></div>`;
  }).join('');
  return switchHtml + `<div class="section-label" style="margin-top:4px">${warningViewMode === 'local' ? `${cityName} 生效预警` : `全国生效预警（前 ${list.length} 条）`}</div>` + items;
}
function switchWarningView(mode) { if (warningViewMode === mode) return; warningViewMode = mode; const d = state.data; if (d) document.getElementById('warningContent').innerHTML = buildWarningPage(d); }
function buildIndicesPage(indices) {
  if (!indices?.length) return `<div class="rain-empty"><div class="re-icon">📋</div>暂无生活指数数据</div>`;
  const cards = indices.map(x => `<div class="index-card glass"><div class="idx-type">${x.name || x.typeName}</div><div class="idx-category">${x.category}</div><div class="idx-text">${x.text || ''}</div></div>`).join('');
  return `<div class="section-label" style="margin-top:16px">生活指数（共 ${indices.length} 项）</div><div class="indices-grid">${cards}</div>`;
}

/* ================================================================
   详情页（可信度 + 指标 + 天文 + WeatherAPI 补充）
   ================================================================ */
function buildDetailPage(d) {
  return `
    ${buildConfidenceCard(d)}
    <div class="section-label" style="margin-top:16px">详细指标</div>
    ${buildMetrics(d.now, d.air)}
    ${buildAstro(d.sun, d.moon)}
    ${buildWeatherApiSummary(d.weatherApiFull)}
  `;
}

// 结论优先的可信度卡片
function buildConfidenceCard(d) {
  const fused = d.consensus;
  const mae = d.mae;
  const vote = d.weatherVote;
  const precip = d.precip;
  const src = d.sources || {};

  if (!fused && !mae) {
    return `<div class="section-label">综合可信度</div>
      <div class="conf-card glass">
        <div style="font-size:13px;color:var(--text-secondary);text-align:center;line-height:1.7;padding:16px 0">
          数据源不足，暂无法判断可信度。<br>配置 WeatherAPI Key 可获得更多源交叉验证。
        </div>
      </div>`;
  }

  const level = fused ? fused.confidence : 'mid';
  const icon = level === 'high' ? '✅' : level === 'mid' ? '🟡' : '⚠️';
  const headline = level === 'high' ? '多源预报一致，可信度高'
    : level === 'mid' ? '多源预报基本一致，可信度中等'
    : '多源预报存在分歧，建议关注临近预报';
  const color = level === 'high' ? '#6bcf7f' : level === 'mid' ? '#ffd166' : '#ff6b6b';

  const srcList = [
    { name: '和风', temp: src.qweather },
    { name: 'Open-Meteo', temp: src.openMeteo },
    { name: 'WeatherAPI', temp: src.weatherApi },
  ].filter(s => s.temp != null);

  return `<div class="section-label">综合可信度</div>
    <div class="conf-card glass">
      <div class="conf-head">
        <span class="conf-icon">${icon}</span>
        <span class="conf-title" style="color:${color}">${headline}</span>
      </div>
      <div class="conf-temps">
        ${srcList.map(s => `<div class="conf-temp-item"><div class="ct-val">${s.temp}°</div><div class="ct-name">${s.name}</div></div>`).join('')}
      </div>
      <div class="conf-meta">
        ${fused ? `${fused.sourceCount} 个源 · 温度标准差 ${fused.spread}°` : ''}
        ${mae ? ` · 历史误差 ±${mae.mae}°C（${mae.days} 天）` : ''}
        ${vote && vote.total > 1 ? ` · 天气现象 ${vote.agreement}/${vote.total} 一致` : ''}
      </div>
      ${precip && precip.hasDisagreement ? `<div class="conf-warn">⚠️ 降水概率分歧较大（${precip.maxRisk}% vs ${precip.average}%），建议同时关注临近预报</div>` : ''}
      <details class="conf-detail">
        <summary>查看各源原始数据</summary>
        <div class="conf-raw">
          ${srcList.map(s => `<div class="conf-raw-row"><span>${s.name}</span><span>${s.temp}°</span></div>`).join('')}
        </div>
      </details>
    </div>`;
}

function buildMetrics(now, air) {
  const cards = [];
  cards.push(metricCard('湿度', `${now.humidity}<small>%</small>`, `露点温度 ${now.dew || '—'}°`));
  cards.push(metricCard('风速', `${now.windSpeed}<small>公里/小时</small>`, `${now.windDir || ''} ${now.windScale || '—'}级`));
  cards.push(metricCard('气压', `${now.pressure}<small>百帕</small>`, '海平面气压'));
  cards.push(metricCard('能见度', `${now.vis}<small>公里</small>`, '水平能见度'));
  if (air) {
    const aqi = parseInt(air.aqi, 10) || 0, pct = Math.min(Math.max(aqi / 300, 0), 1) * 100;
    const AIR_CN = aqi <= 50 ? '优' : aqi <= 100 ? '良' : aqi <= 150 ? '轻度污染' : aqi <= 200 ? '中度污染' : aqi <= 300 ? '重度污染' : '严重污染';
    const POLL = { pm2p5:'PM2.5', pm10:'PM10', o3:'臭氧', no2:'二氧化氮', so2:'二氧化硫', co:'一氧化碳' };
    cards.push(`<div class="metric-card glass" style="grid-column:span 2"><div class="m-label">空气质量 · ${AIR_CN}</div><div class="m-value">${air.aqi}<small>AQI</small></div><div class="m-sub">首要污染物：${POLL[air.primary] || air.primary || '—'}</div><div class="aqi-bar"><div class="aqi-dot" style="left:${pct}%"></div></div></div>`);
  }
  return `<div class="metrics-grid">${cards.join('')}</div>`;
}
function fmtTime(iso) { if (!iso) return '—'; const m = String(iso).match(/T(\d{2}:\d{2})/); return m ? m[1] : String(iso).slice(0, 5); }
function buildAstro(sun, moon) {
  if (!sun && !moon) return '';
  const items = [];
  if (sun) { items.push(`<div class="astro-item"><div class="a-label">日出</div><div class="a-value">${fmtTime(sun.sunrise)}</div></div>`); items.push(`<div class="astro-item"><div class="a-label">日落</div><div class="a-value">${fmtTime(sun.sunset)}</div></div>`); }
  if (moon) { items.push(`<div class="astro-item"><div class="a-label">月相</div><div class="a-value">${moon.name || '—'}</div><div class="a-sub">照明 ${moon.illumination || '—'}%</div></div>`); items.push(`<div class="astro-item"><div class="a-label">月升 / 月落</div><div class="a-value">${fmtTime(moon.moonrise)} / ${fmtTime(moon.moonset)}</div></div>`); }
  return `<div class="section-label">天文</div><div class="astro-card glass">${items.join('')}</div>`;
}
function metricCard(label, value, sub) { return `<div class="metric-card glass"><div class="m-label">${label}</div><div class="m-value">${value}</div>${sub ? `<div class="m-sub">${sub}</div>` : ''}</div>`; }

// WeatherAPI 一句话结论 + 折叠详情
function buildWeatherApiSummary(wa) {
  if (!wa) return '';
  const aqi = wa.current?.air_quality || {};
  const usEpa = aqi['us-epa-index'];
  const text = usEpa == null ? '空气质量数据暂缺'
    : usEpa <= 50 ? '🌿 空气质量优，适合户外活动'
    : usEpa <= 100 ? '🍃 空气质量良，敏感人群注意'
    : usEpa <= 150 ? '😷 轻度污染，敏感人群减少户外'
    : '⚠️ 空气质量较差，建议减少户外活动';

  return `<div class="section-label" style="margin-top:18px">补充参考 · WeatherAPI</div>
    <div class="wa-mini glass">
      <div class="wa-mini-text">${text}</div>
      <details class="wa-mini-detail">
        <summary>查看 WeatherAPI 详细数据（六项污染物）</summary>
        <div class="wa-mini-grid">
          <div>PM2.5：${aqi.pm2_5?.toFixed(1) ?? '—'} μg/m³</div>
          <div>PM10：${aqi.pm10?.toFixed(1) ?? '—'} μg/m³</div>
          <div>O₃：${aqi.o3?.toFixed(1) ?? '—'} μg/m³</div>
          <div>NO₂：${aqi.no2?.toFixed(1) ?? '—'} μg/m³</div>
          <div>SO₂：${aqi.so2?.toFixed(1) ?? '—'} μg/m³</div>
          <div>CO：${aqi.co?.toFixed(1) ?? '—'} μg/m³</div>
        </div>
        <div class="wa-mini-note">数据来自 WeatherAPI 免费计划（3 天预报 + 空气质量），作为和风天气主数据源的交叉验证参考。</div>
      </details>
    </div>`;
}

/* ================================================================
   手势 & 初始化
   ================================================================ */
const viewsEl = document.getElementById('views');
let swipeStartX = 0, swipeStartY = 0, swiping = false;
viewsEl.addEventListener('touchstart', e => {
  if (e.target.closest('.hourly-scroll, .indices-grid, .rain-chart, .cs-list')) return;
  const t = e.touches[0]; swipeStartX = t.clientX; swipeStartY = t.clientY; swiping = true;
}, { passive: true });
viewsEl.addEventListener('touchend', e => {
  if (!swiping) return; swiping = false;
  const t = e.changedTouches[0];
  const dx = t.clientX - swipeStartX, dy = t.clientY - swipeStartY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    const idx = TABS.indexOf(currentTab);
    if (dx < 0 && idx < TABS.length - 1) switchTab(TABS[idx + 1]);
    if (dx > 0 && idx > 0) switchTab(TABS[idx - 1]);
  }
}, { passive: true });

(function init() {
  loadSettings();
  updateApiStatusBar();
  const hash = location.hash.slice(1);
  if (TABS.includes(hash)) switchTab(hash, false);
  if (!state.apiKey) {
    document.getElementById('homeContent').innerHTML = '<div class="loading">点击右上角 ⚙ 填写和风天气凭据</div>';
    openSettings();
  } else {
    initLocation();
  }
})();
document.getElementById('settingsOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeSettings(); });
</script>
</body>
</html>
